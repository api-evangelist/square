    RiskEvaluation:
      type: object
      description: 'Represents fraud risk information for the associated payment.


        When you take a payment through Square''s Payments API (using the `CreatePayment`

        endpoint), Square evaluates it and assigns a risk level to the payment. Sellers

        can use this information to determine the course of action (for example,

        provide the goods/services or refund the payment).'
      x-release-status: BETA
      required:
      - status
      properties:
        created_at:
          type: string
          description: The timestamp when payment risk was evaluated, in RFC 3339 format.
          readOnly: true
        risk_level:
          $ref: '#/components/schemas/RiskEvaluationRiskLevel'
          description: 'The risk level associated with the payment

            See [RiskEvaluationRiskLevel](#type-riskevaluationrisklevel) for possible values'
          nullable: true
    Payment:
      type: object
      description: Represents a payment processed by the Square API.
      x-release-status: PUBLIC
      properties:
        id:
          type: string
          description: A unique ID for the payment.
          maxLength: 192
          readOnly: true
        created_at:
          type: string
          description: The timestamp of when the payment was created, in RFC 3339 format.
          maxLength: 32
          readOnly: true
        updated_at:
          type: string
          description: The timestamp of when the payment was last updated, in RFC 3339 format.
          maxLength: 32
          readOnly: true
        amount_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount processed for this payment, not including `tip_money`.


            The amount is specified in the smallest denomination of the applicable currency (for example,

            US dollar amounts are specified in cents). For more information, see

            [Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts).'
          nullable: true
        tip_money:
          $ref: '#/components/schemas/Money'
          description: "The amount designated as a tip. \n\nThis amount is specified in the smallest denomination of the applicable currency (for example,\nUS dollar amounts are specified in cents). For more information, see\n[Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts)."
          nullable: true
        total_money:
          $ref: '#/components/schemas/Money'
          description: 'The total amount for the payment, including `amount_money` and `tip_money`.

            This amount is specified in the smallest denomination of the applicable currency (for example,

            US dollar amounts are specified in cents). For more information, see

            [Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts).'
          readOnly: true
        app_fee_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount the developer is taking as a fee for facilitating the payment on behalf

            of the seller. This amount is specified in the smallest denomination of the applicable currency

            (for example, US dollar amounts are specified in cents). For more information,

            see [Take Payments and Collect Fees](https://developer.squareup.com/docs/payments-api/take-payments-and-collect-fees).


            The amount cannot be more than 90% of the `total_money` value.


            To set this field, `PAYMENTS_WRITE_ADDITIONAL_RECIPIENTS` OAuth permission is required.

            For more information, see [Permissions](https://developer.squareup.com/docs/payments-api/take-payments-and-collect-fees#permissions).'
          nullable: true
        approved_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money approved for this payment. This value may change if Square chooses to

            obtain reauthorization as part of a call to [UpdatePayment](api-endpoint:Payments-UpdatePayment).'
          nullable: true
        processing_fee:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingFee'
          description: The processing fees and fee adjustments assessed by Square for this payment.
          readOnly: true
        refunded_money:
          $ref: '#/components/schemas/Money'
          description: "The total amount of the payment refunded to date. \n\nThis amount is specified in the smallest denomination of the applicable currency (for example,\nUS dollar amounts are specified in cents)."
          readOnly: true
        status:
          type: string
          description: Indicates whether the payment is APPROVED, PENDING, COMPLETED, CANCELED, or FAILED.
          maxLength: 50
          readOnly: true
        delay_duration:
          type: string
          description: 'The duration of time after the payment''s creation when Square automatically applies the

            `delay_action` to the payment. This automatic `delay_action` applies only to payments that

            do not reach a terminal state (COMPLETED, CANCELED, or FAILED) before the `delay_duration`

            time period.


            This field is specified as a time duration, in RFC 3339 format.


            Notes:

            This feature is only supported for card payments.


            Default:


            - Card-present payments: "PT36H" (36 hours) from the creation time.

            - Card-not-present payments: "P7D" (7 days) from the creation time.'
          readOnly: true
        delay_action:
          type: string
          description: 'The action to be applied to the payment when the `delay_duration` has elapsed.


            Current values include `CANCEL` and `COMPLETE`.'
          nullable: true
        delayed_until:
          type: string
          description: 'The read-only timestamp of when the `delay_action` is automatically applied,

            in RFC 3339 format.


            Note that this field is calculated by summing the payment''s `delay_duration` and `created_at`

            fields. The `created_at` field is generated by Square and might not exactly match the

            time on your local machine.'
          readOnly: true
        source_type:
          type: string
          description: 'The source type for this payment.


            Current values include `CARD`, `BANK_ACCOUNT`, `WALLET`, `BUY_NOW_PAY_LATER`, `SQUARE_ACCOUNT`,

            `CASH` and `EXTERNAL`. For information about these payment source types,

            see [Take Payments](https://developer.squareup.com/docs/payments-api/take-payments).'
          maxLength: 50
          readOnly: true
        card_details:
          $ref: '#/components/schemas/CardPaymentDetails'
          description: Details about a card payment. These details are only populated if the source_type is `CARD`.
          readOnly: true
        cash_details:
          $ref: '#/components/schemas/CashPaymentDetails'
          description: Details about a cash payment. These details are only populated if the source_type is `CASH`.
          nullable: true
        bank_account_details:
          $ref: '#/components/schemas/BankAccountPaymentDetails'
          description: Details about a bank account payment. These details are only populated if the source_type is `BANK_ACCOUNT`.
          readOnly: true
        external_details:
          $ref: '#/components/schemas/ExternalPaymentDetails'
          description: "Details about an external payment. The details are only populated \nif the `source_type` is `EXTERNAL`."
          readOnly: true
        wallet_details:
          $ref: '#/components/schemas/DigitalWalletDetails'
          description: "Details about an wallet payment. The details are only populated \nif the `source_type` is `WALLET`."
          readOnly: true
        buy_now_pay_later_details:
          $ref: '#/components/schemas/BuyNowPayLaterDetails'
          description: "Details about a Buy Now Pay Later payment. The details are only populated\nif the `source_type` is `BUY_NOW_PAY_LATER`. For more information, see \n[Afterpay Payments](https://developer.squareup.com/docs/payments-api/take-payments/afterpay-payments)."
          readOnly: true
        square_account_details:
          $ref: '#/components/schemas/SquareAccountDetails'
          description: 'Details about a Square Account payment. The details are only populated

            if the `source_type` is `SQUARE_ACCOUNT`.'
          readOnly: true
        location_id:
          type: string
          description: The ID of the location associated with the payment.
          maxLength: 50
          readOnly: true
        order_id:
          type: string
          description: The ID of the order associated with the payment.
          maxLength: 192
          readOnly: true
        reference_id:
          type: string
          description: 'An optional ID that associates the payment with an entity in

            another system.'
          maxLength: 40
          readOnly: true
        customer_id:
          type: string
          description: "The ID of the customer associated with the payment. If the ID is \nnot provided in the `CreatePayment` request that was used to create the `Payment`, \nSquare may use information in the request \n(such as the billing and shipping address, email address, and payment source) \nto identify a matching customer profile in the Customer Directory. \nIf found, the profile ID is used. If a profile is not found, the \nAPI attempts to create an \n[instant profile](https://developer.squareup.com/docs/customers-api/what-it-does#instant-profiles). \nIf the API cannot create an \ninstant profile (either because the seller has disabled it or the \nseller's region prevents creating it), this field remains unset. Note that \nthis process is asynchronous and it may take some time before a \ncustomer ID is added to the payment."
          maxLength: 191
          readOnly: true
        employee_id:
          type: string
          description: '__Deprecated__: Use `Payment.team_member_id` instead.


            An optional ID of the employee associated with taking the payment.'
          maxLength: 192
          readOnly: true
          x-release-status: DEPRECATED
        team_member_id:
          type: string
          description: An optional ID of the [TeamMember](entity:TeamMember) associated with taking the payment.
          maxLength: 192
          nullable: true
        refund_ids:
          type: array
          items:
            type: string
          description: A list of `refund_id`s identifying refunds for the payment.
          readOnly: true
        risk_evaluation:
          $ref: '#/components/schemas/RiskEvaluation'
          description: 'Provides information about the risk associated with the payment, as determined by Square.

            This field is present for payments to sellers that have opted in to receive risk

            evaluations.'
          readOnly: true
          x-release-status: BETA
        terminal_checkout_id:
          type: string
          description: An optional ID for a Terminal checkout that is associated with the payment.
          readOnly: true
          x-release-status: BETA
        buyer_email_address:
          type: string
          description: The buyer's email address.
          maxLength: 255
          readOnly: true
        billing_address:
          $ref: '#/components/schemas/Address'
          description: The buyer's billing address.
          readOnly: true
        shipping_address:
          $ref: '#/components/schemas/Address'
          description: The buyer's shipping address.
          readOnly: true
        note:
          type: string
          description: An optional note to include when creating a payment.
          maxLength: 500
          readOnly: true
        statement_description_identifier:
          type: string
          description: 'Additional payment information that gets added to the customer''s card statement

            as part of the statement description.


            Note that the `statement_description_identifier` might get truncated on the statement description

            to fit the required information including the Square identifier (SQ *) and the name of the

            seller taking the payment.'
          readOnly: true
        capabilities:
          type: array
          items:
            type: string
          description: 'Actions that can be performed on this payment:

            - `EDIT_AMOUNT_UP` - The payment amount can be edited up.

            - `EDIT_AMOUNT_DOWN` - The payment amount can be edited down.

            - `EDIT_TIP_AMOUNT_UP` - The tip amount can be edited up.

            - `EDIT_TIP_AMOUNT_DOWN` - The tip amount can be edited down.

            - `EDIT_DELAY_ACTION` - The delay_action can be edited.'
          readOnly: true
        receipt_number:
          type: string
          description: 'The payment''s receipt number.

            The field is missing if a payment is canceled.'
          maxLength: 4
          readOnly: true
        receipt_url:
          type: string
          description: 'The URL for the payment''s receipt.

            The field is only populated for COMPLETED payments.'
          maxLength: 255
          readOnly: true
        device_details:
          $ref: '#/components/schemas/DeviceDetails'
          description: Details about the device that took the payment.
          readOnly: true
        application_details:
          $ref: '#/components/schemas/ApplicationDetails'
          description: Details about the application that took the payment.
          readOnly: true
        is_offline_payment:
          type: boolean
          description: Whether or not this payment was taken offline.
          readOnly: true
        offline_payment_details:
          $ref: '#/components/schemas/OfflinePaymentDetails'
          description: Additional information about the payment if it was taken offline.
          readOnly: true
        version_token:
          type: string
          description: 'Used for optimistic concurrency. This opaque token identifies a specific version of the

            `Payment` object.'
          nullable: true
