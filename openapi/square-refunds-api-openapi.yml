servers:
- url: https://connect.squareup.com
  variables: {}
tags:
- name: Refunds
paths:
  /v2/refunds:
    get:
      tags:
      - Refunds
      summary: Square List Payment Refunds
      operationId: ListPaymentRefunds
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Retrieves a list of refunds for the account making the request.


        Results are eventually consistent, and new refunds or changes to refunds might take several

        seconds to appear.


        The maximum results per page is 100.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - PAYMENTS_READ
      parameters:
      - name: begin_time
        description: "Indicates the start of the time range to retrieve each `PaymentRefund` for, in RFC 3339 \nformat.  The range is determined using the `created_at` field for each `PaymentRefund`. \n\nDefault: The current time minus one year."
        schema:
          type: string
        in: query
        required: false
      - name: end_time
        description: "Indicates the end of the time range to retrieve each `PaymentRefund` for, in RFC 3339 \nformat.  The range is determined using the `created_at` field for each `PaymentRefund`.\n\nDefault: The current time."
        schema:
          type: string
        in: query
        required: false
      - name: sort_order
        description: 'The order in which results are listed by `PaymentRefund.created_at`:

          - `ASC` - Oldest to newest.

          - `DESC` - Newest to oldest (default).'
        schema:
          type: string
        in: query
        required: false
      - name: cursor
        description: 'A pagination cursor returned by a previous call to this endpoint.

          Provide this cursor to retrieve the next set of results for the original query.


          For more information, see [Pagination](https://developer.squareup.com/docs/build-basics/common-api-patterns/pagination).'
        schema:
          type: string
        in: query
        required: false
      - name: location_id
        description: 'Limit results to the location supplied. By default, results are returned

          for all locations associated with the seller.'
        schema:
          type: string
        in: query
        required: false
      - name: status
        description: 'If provided, only refunds with the given status are returned.

          For a list of refund status values, see [PaymentRefund](entity:PaymentRefund).


          Default: If omitted, refunds are returned regardless of their status.'
        schema:
          type: string
        in: query
        required: false
      - name: source_type
        description: 'If provided, only returns refunds whose payments have the indicated source type.

          Current values include `CARD`, `BANK_ACCOUNT`, `WALLET`, `CASH`, and `EXTERNAL`.

          For information about these payment source types, see

          [Take Payments](https://developer.squareup.com/docs/payments-api/take-payments).


          Default: If omitted, refunds are returned regardless of the source type.'
        schema:
          type: string
        in: query
        required: false
      - name: limit
        description: 'The maximum number of results to be returned in a single page.


          It is possible to receive fewer results than the specified limit on a given page.


          If the supplied value is greater than 100, no more than 100 results are returned.


          Default: 100'
        schema:
          type: integer
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentRefundsResponse'
    post:
      tags:
      - Refunds
      summary: Square Refund Payment
      operationId: RefundPayment
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: "Refunds a payment. You can refund the entire payment amount or a\nportion of it. You can use this endpoint to refund a card payment or record a \nrefund of a cash or external payment. For more information, see\n[Refund Payment](https://developer.squareup.com/docs/payments-api/refund-payments)."
      x-release-status: PUBLIC
      security:
      - oauth2:
        - PAYMENTS_WRITE
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundPaymentResponse'
      x-endpoint-errors:
      - error-code: CARD_MISMATCH
      - error-code: CARD_PRESENCE_REQUIRED
      - error-code: CARD_TOKEN_USED
      - error-code: GENERIC_DECLINE
      - error-code: INSUFFICIENT_PERMISSIONS_FOR_REFUND
      - error-code: INVALID_CARD
      - error-code: INVALID_CARD_DATA
      - error-code: INVALID_FEES
      - error-code: PAYMENT_NOT_REFUNDABLE
      - error-code: PAYMENT_NOT_REFUNDABLE_DUE_TO_DISPUTE
      - error-code: REFUND_AMOUNT_INVALID
      - error-code: REFUND_DECLINED
      - error-code: UNSUPPORTED_CARD_BRAND
      - error-code: UNSUPPORTED_COUNTRY
      - error-code: UNSUPPORTED_CURRENCY
      - error-code: UNSUPPORTED_INSTRUMENT_TYPE
      - error-code: UNSUPPORTED_SOURCE_TYPE
      - error-code: VALUE_TOO_HIGH
      - error-code: VERSION_MISMATCH
  /v2/refunds/{refund_id}:
    get:
      tags:
      - Refunds
      summary: Square Get Payment Refund
      operationId: GetPaymentRefund
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Retrieves a specific refund using the `refund_id`.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - PAYMENTS_READ
      parameters:
      - name: refund_id
        description: The unique ID for the desired `PaymentRefund`.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentRefundResponse'
components:
  schemas:
    Address:
      type: object
      description: "Represents a postal address in a country. \nFor more information, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses)."
      x-release-status: PUBLIC
      properties:
        address_line_1:
          type: string
          description: 'The first line of the address.


            Fields that start with `address_line` provide the address''s most specific

            details, like street number, street name, and building name. They do *not*

            provide less specific details like city, state/province, or country (these

            details are provided in other fields).'
          nullable: true
        address_line_2:
          type: string
          description: The second line of the address, if any.
          nullable: true
        address_line_3:
          type: string
          description: The third line of the address, if any.
          nullable: true
        locality:
          type: string
          description: The city or town of the address. For a full list of field meanings by country, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses).
          nullable: true
        sublocality:
          type: string
          description: A civil region within the address's `locality`, if any.
          nullable: true
        sublocality_2:
          type: string
          description: A civil region within the address's `sublocality`, if any.
          nullable: true
        sublocality_3:
          type: string
          description: A civil region within the address's `sublocality_2`, if any.
          nullable: true
        administrative_district_level_1:
          type: string
          description: 'A civil entity within the address''s country. In the US, this

            is the state. For a full list of field meanings by country, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses).'
          nullable: true
        administrative_district_level_2:
          type: string
          description: 'A civil entity within the address''s `administrative_district_level_1`.

            In the US, this is the county.'
          nullable: true
        administrative_district_level_3:
          type: string
          description: 'A civil entity within the address''s `administrative_district_level_2`,

            if any.'
          nullable: true
        postal_code:
          type: string
          description: The address's postal code. For a full list of field meanings by country, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses).
          nullable: true
        country:
          $ref: '#/components/schemas/Country'
          description: 'The address''s country, in the two-letter format of ISO 3166. For example, `US` or `FR`.

            See [Country](#type-country) for possible values'
          nullable: true
        first_name:
          type: string
          description: Optional first name when it's representing recipient.
          nullable: true
        last_name:
          type: string
          description: Optional last name when it's representing recipient.
          nullable: true
    ListPaymentRefundsResponse:
      type: object
      description: 'Defines the response returned by [ListPaymentRefunds](api-endpoint:Refunds-ListPaymentRefunds).


        Either `errors` or `refunds` is present in a given response (never both).'
      x-release-status: PUBLIC
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: Information about errors encountered during the request.
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRefund'
          description: The list of requested refunds.
        cursor:
          type: string
          description: 'The pagination cursor to be used in a subsequent request. If empty,

            this is the final response.


            For more information, see [Pagination](https://developer.squareup.com/docs/build-basics/common-api-patterns/pagination).'
