    Money:
      type: object
      description: 'Represents an amount of money. `Money` fields can be signed or unsigned.

        Fields that do not explicitly define whether they are signed or unsigned are

        considered unsigned and can only hold positive amounts. For signed fields, the

        sign of the value indicates the purpose of the money transfer. See

        [Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts)

        for more information.'
      x-release-status: PUBLIC
      properties:
        amount:
          type: integer
          description: 'The amount of money, in the smallest denomination of the currency

            indicated by `currency`. For example, when `currency` is `USD`, `amount` is

            in cents. Monetary amounts can be positive or negative. See the specific

            field description to determine the meaning of the sign in a particular case.'
          format: int64
          nullable: true
        currency:
          $ref: '#/components/schemas/Currency'
          description: 'The type of currency, in __ISO 4217 format__. For example, the currency

            code for US dollars is `USD`.


            See [Currency](entity:Currency) for possible values.

            See [Currency](#type-currency) for possible values'
          nullable: true
    DeviceCheckoutOptions:
      type: object
      x-release-status: PUBLIC
      required:
      - device_id
      properties:
        device_id:
          type: string
          description: 'The unique ID of the device intended for this `TerminalCheckout`.

            A list of `DeviceCode` objects can be retrieved from the /v2/devices/codes endpoint.

            Match a `DeviceCode.device_id` value with `device_id` to get the associated device code.'
        skip_receipt_screen:
          type: boolean
          description: Instructs the device to skip the receipt screen. Defaults to false.
          nullable: true
        collect_signature:
          type: boolean
          description: Indicates that signature collection is desired during checkout. Defaults to false.
          nullable: true
        tip_settings:
          $ref: '#/components/schemas/TipSettings'
          description: Tip-specific settings.
          nullable: true
        show_itemized_cart:
          type: boolean
          description: 'Show the itemization screen prior to taking a payment. This field is only meaningful when the

            checkout includes an order ID. Defaults to true.'
          x-release-status: BETA
          nullable: true
    DataCollectionOptions:
      type: object
      x-release-status: BETA
