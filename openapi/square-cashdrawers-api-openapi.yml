    CashDrawerShiftSummary:
      type: object
      description: 'The summary of a closed cash drawer shift.

        This model contains only the money counted to start a cash drawer shift, counted

        at the end of the shift, and the amount that should be in the drawer at shift

        end based on summing all cash drawer shift events.'
      x-release-status: PUBLIC
      properties:
        id:
          type: string
          description: The shift unique ID.
        state:
          $ref: '#/components/schemas/CashDrawerShiftState'
          description: 'The shift current state.

            See [CashDrawerShiftState](#type-cashdrawershiftstate) for possible values'
          nullable: true
        opened_at:
          type: string
          description: The shift start time in ISO 8601 format.
          nullable: true
        ended_at:
          type: string
          description: The shift end time in ISO 8601 format.
          nullable: true
        closed_at:
          type: string
          description: The shift close time in ISO 8601 format.
          nullable: true
        description:
          type: string
          description: An employee free-text description of a cash drawer shift.
          nullable: true
        opened_cash_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money in the cash drawer at the start of the shift. This

            must be a positive amount.'
          nullable: true
        expected_cash_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money that should be in the cash drawer at the end of the

            shift, based on the cash drawer events on the shift.

            The amount is correct if all shift employees accurately recorded their

            cash drawer shift events. Unrecorded events and events with the wrong amount

            result in an incorrect expected_cash_money amount that can be negative.'
          nullable: true
        closed_cash_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money found in the cash drawer at the end of the shift by

            an auditing employee. The amount must be greater than or equal to zero.'
          nullable: true
        created_at:
          type: string
          description: The shift start time in RFC 3339 format.
          readOnly: true
        updated_at:
          type: string
          description: The shift updated at time in RFC 3339 format.
          readOnly: true
        location_id:
          type: string
          description: The ID of the location the cash drawer shift belongs to.
          readOnly: true
