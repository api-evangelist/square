    Money:
      type: object
      description: 'Represents an amount of money. `Money` fields can be signed or unsigned.

        Fields that do not explicitly define whether they are signed or unsigned are

        considered unsigned and can only hold positive amounts. For signed fields, the

        sign of the value indicates the purpose of the money transfer. See

        [Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts)

        for more information.'
      x-release-status: PUBLIC
      properties:
        amount:
          type: integer
          description: 'The amount of money, in the smallest denomination of the currency

            indicated by `currency`. For example, when `currency` is `USD`, `amount` is

            in cents. Monetary amounts can be positive or negative. See the specific

            field description to determine the meaning of the sign in a particular case.'
          format: int64
          nullable: true
        currency:
          $ref: '#/components/schemas/Currency'
          description: 'The type of currency, in __ISO 4217 format__. For example, the currency

            code for US dollars is `USD`.


            See [Currency](entity:Currency) for possible values.

            See [Currency](#type-currency) for possible values'
          nullable: true
    CashDrawerShift:
      type: object
      description: 'This model gives the details of a cash drawer shift.

        The cash_payment_money, cash_refund_money, cash_paid_in_money,

        and cash_paid_out_money fields are all computed by summing their respective

        event types.'
      x-release-status: PUBLIC
      properties:
        id:
          type: string
          description: The shift unique ID.
        state:
          $ref: '#/components/schemas/CashDrawerShiftState'
          description: 'The shift current state.

            See [CashDrawerShiftState](#type-cashdrawershiftstate) for possible values'
          nullable: true
        opened_at:
          type: string
          description: The time when the shift began, in ISO 8601 format.
          nullable: true
        ended_at:
          type: string
          description: The time when the shift ended, in ISO 8601 format.
          nullable: true
        closed_at:
          type: string
          description: The time when the shift was closed, in ISO 8601 format.
          nullable: true
        description:
          type: string
          description: The free-form text description of a cash drawer by an employee.
          nullable: true
        opened_cash_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money in the cash drawer at the start of the shift.

            The amount must be greater than or equal to zero.'
          nullable: true
        cash_payment_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money added to the cash drawer from cash payments.

            This is computed by summing all events with the types CASH_TENDER_PAYMENT and

            CASH_TENDER_CANCELED_PAYMENT. The amount is always greater than or equal to

            zero.'
          nullable: true
        cash_refunds_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money removed from the cash drawer from cash refunds.

            It is computed by summing the events of type CASH_TENDER_REFUND. The amount

            is always greater than or equal to zero.'
          nullable: true
        cash_paid_in_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money added to the cash drawer for reasons other than cash

            payments. It is computed by summing the events of type PAID_IN. The amount is

            always greater than or equal to zero.'
          nullable: true
        cash_paid_out_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money removed from the cash drawer for reasons other than

            cash refunds. It is computed by summing the events of type PAID_OUT. The amount

            is always greater than or equal to zero.'
          nullable: true
        expected_cash_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money that should be in the cash drawer at the end of the

            shift, based on the shift''s other money amounts.

            This can be negative if employees have not correctly recorded all the events

            on the cash drawer.

            cash_paid_out_money is a summation of amounts from cash_payment_money (zero

            or positive), cash_refunds_money (zero or negative), cash_paid_in_money (zero

            or positive), and cash_paid_out_money (zero or negative) event types.'
          nullable: true
        closed_cash_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money found in the cash drawer at the end of the shift

            by an auditing employee. The amount should be positive.'
          nullable: true
        device:
          $ref: '#/components/schemas/CashDrawerDevice'
          description: The device running Square Point of Sale that was connected to the cash drawer.
          nullable: true
        created_at:
          type: string
          description: The shift start time in RFC 3339 format.
          readOnly: true
        updated_at:
          type: string
          description: The shift updated at time in RFC 3339 format.
          readOnly: true
        location_id:
          type: string
          description: The ID of the location the cash drawer shift belongs to.
          readOnly: true
        team_member_ids:
          type: array
          items:
            type: string
          description: 'The IDs of all team members that were logged into Square Point of Sale at any

            point while the cash drawer shift was open.'
          readOnly: true
        opening_team_member_id:
          type: string
          description: The ID of the team member that started the cash drawer shift.
          readOnly: true
        ending_team_member_id:
          type: string
          description: The ID of the team member that ended the cash drawer shift.
          readOnly: true
        closing_team_member_id:
          type: string
          description: 'The ID of the team member that closed the cash drawer shift by auditing

            the cash drawer contents.'
          readOnly: true
    CashDrawerEventType:
      type: string
      enum:
      - NO_SALE
      - CASH_TENDER_PAYMENT
      - OTHER_TENDER_PAYMENT
      - CASH_TENDER_CANCELLED_PAYMENT
      - OTHER_TENDER_CANCELLED_PAYMENT
      - CASH_TENDER_REFUND
      - OTHER_TENDER_REFUND
      - PAID_IN
      - PAID_OUT
      x-enum-elements:
      - name: NO_SALE
        description: 'Triggered when a no sale occurs on a cash drawer.

          A CashDrawerEvent of this type must have a zero money amount.'
      - name: CASH_TENDER_PAYMENT
        description: 'Triggered when a cash tender payment occurs on a cash drawer.

          A CashDrawerEvent of this type can must not have a negative amount.'
      - name: OTHER_TENDER_PAYMENT
        description: 'Triggered when a check, gift card, or other non-cash payment occurs

          on a cash drawer.

          A CashDrawerEvent of this type must have a zero money amount.'
      - name: CASH_TENDER_CANCELLED_PAYMENT
        description: 'Triggered when a split tender bill is cancelled after cash has been

          tendered.

          A CASH_TENDER_CANCELLED_PAYMENT should have a corresponding CASH_TENDER_PAYMENT.

          A CashDrawerEvent of this type must not have a negative amount.'
      - name: OTHER_TENDER_CANCELLED_PAYMENT
        description: 'Triggered when a split tender bill is cancelled after a non-cash tender

          has been tendered. An OTHER_TENDER_CANCELLED_PAYMENT should have a corresponding

          OTHER_TENDER_PAYMENT. A CashDrawerEvent of this type must have a zero money

          amount.'
      - name: CASH_TENDER_REFUND
        description: 'Triggered when a cash tender refund occurs.

          A CashDrawerEvent of this type must not have a negative amount.'
      - name: OTHER_TENDER_REFUND
        description: 'Triggered when an other tender refund occurs.

          A CashDrawerEvent of this type must have a zero money amount.'
      - name: PAID_IN
        description: 'Triggered when money unrelated to a payment is added to the cash drawer.

          For example, an employee adds coins to the drawer.

          A CashDrawerEvent of this type must not have a negative amount.'
      - name: PAID_OUT
        description: 'Triggered when money is removed from the drawer for other reasons

          than making change.

          For example, an employee pays a delivery person with cash from the cash drawer.

          A CashDrawerEvent of this type must not have a negative amount.'
      description: 'The types of events on a CashDrawerShift.

        Each event type represents an employee action on the actual cash drawer

        represented by a CashDrawerShift.'
      x-release-status: PUBLIC
    SortOrder:
      type: string
      enum:
      - DESC
      - ASC
      x-enum-elements:
      - name: DESC
        description: The results are returned in descending (e.g., newest-first or Z-A) order.
      - name: ASC
        description: The results are returned in ascending (e.g., oldest-first or A-Z) order.
      description: The order (e.g., chronological or alphabetical) in which results from a request are returned.
      x-release-status: PUBLIC
    Error:
