servers:
- url: https://connect.squareup.com
  variables: {}
tags:
- name: CashDrawers
paths:
  /v2/cash-drawers/shifts:
    get:
      tags:
      - CashDrawers
      summary: Square List Cash Drawer Shifts
      operationId: ListCashDrawerShifts
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Provides the details for all of the cash drawer shifts for a location

        in a date range.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - CASH_DRAWER_READ
      parameters:
      - name: location_id
        description: The ID of the location to query for a list of cash drawer shifts.
        schema:
          type: string
        in: query
        required: true
      - name: sort_order
        description: 'The order in which cash drawer shifts are listed in the response,

          based on their opened_at field. Default value: ASC'
        schema:
          $ref: '#/components/schemas/SortOrder'
        in: query
        required: false
      - name: begin_time
        description: The inclusive start time of the query on opened_at, in ISO 8601 format.
        schema:
          type: string
        in: query
        required: false
      - name: end_time
        description: The exclusive end date of the query on opened_at, in ISO 8601 format.
        schema:
          type: string
        in: query
        required: false
      - name: limit
        description: 'Number of cash drawer shift events in a page of results (200 by

          default, 1000 max).'
        schema:
          type: integer
        in: query
        required: false
      - name: cursor
        description: Opaque cursor for fetching the next page of results.
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCashDrawerShiftsResponse'
  /v2/cash-drawers/shifts/{shift_id}:
    get:
      tags:
      - CashDrawers
      summary: Square Retrieve Cash Drawer Shift
      operationId: RetrieveCashDrawerShift
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Provides the summary details for a single cash drawer shift. See

        [ListCashDrawerShiftEvents](api-endpoint:CashDrawers-ListCashDrawerShiftEvents) for a list of cash drawer shift events.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - CASH_DRAWER_READ
      parameters:
      - name: location_id
        description: The ID of the location to retrieve cash drawer shifts from.
        schema:
          type: string
        in: query
        required: true
      - name: shift_id
        description: The shift ID.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveCashDrawerShiftResponse'
  /v2/cash-drawers/shifts/{shift_id}/events:
    get:
      tags:
      - CashDrawers
      summary: Square List Cash Drawer Shift Events
      operationId: ListCashDrawerShiftEvents
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Provides a paginated list of events for a single cash drawer shift.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - CASH_DRAWER_READ
      parameters:
      - name: location_id
        description: The ID of the location to list cash drawer shifts for.
        schema:
          type: string
        in: query
        required: true
      - name: shift_id
        description: The shift ID.
        schema:
          type: string
        in: path
        required: true
      - name: limit
        description: 'Number of resources to be returned in a page of results (200 by

          default, 1000 max).'
        schema:
          type: integer
        in: query
        required: false
      - name: cursor
        description: Opaque cursor for fetching the next page of results.
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCashDrawerShiftEventsResponse'
components:
  schemas:
    CashDrawerDevice:
      type: object
      x-release-status: PUBLIC
      properties:
        id:
          type: string
          description: The device Square-issued ID
        name:
          type: string
          description: The device merchant-specified name.
          nullable: true
    CashDrawerShiftEvent:
      type: object
      x-release-status: PUBLIC
      properties:
        id:
          type: string
          description: The unique ID of the event.
        event_type:
          $ref: '#/components/schemas/CashDrawerEventType'
          description: 'The type of cash drawer shift event.

            See [CashDrawerEventType](#type-cashdrawereventtype) for possible values'
          nullable: true
        event_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of money that was added to or removed from the cash drawer

            in the event. The amount can be positive (for added money)

            or zero (for other tender type payments). The addition or removal of money can be determined by

            by the event type.'
          nullable: true
        created_at:
          type: string
          description: The event time in RFC 3339 format.
          readOnly: true
        description:
          type: string
          description: 'An optional description of the event, entered by the employee that

            created the event.'
          nullable: true
        team_member_id:
          type: string
          description: The ID of the team member that created the event.
          readOnly: true
    CashDrawerShiftState:
      type: string
      enum:
      - OPEN
      - ENDED
      - CLOSED
      x-enum-elements:
      - name: OPEN
        description: An open cash drawer shift.
      - name: ENDED
        description: A cash drawer shift that is ended but has not yet had an employee content audit.
      - name: CLOSED
        description: 'An ended cash drawer shift that is closed with a completed employee

          content audit and recorded result.'
      description: The current state of a cash drawer shift.
      x-release-status: PUBLIC
    ErrorCategory:
      type: string
      enum:
      - API_ERROR
      - AUTHENTICATION_ERROR
      - INVALID_REQUEST_ERROR
      - RATE_LIMIT_ERROR
      - PAYMENT_METHOD_ERROR
      - REFUND_ERROR
      - MERCHANT_SUBSCRIPTION_ERROR
      - EXTERNAL_VENDOR_ERROR
      x-enum-elements:
      - name: API_ERROR
        description: An error occurred with the Connect API itself.
      - name: AUTHENTICATION_ERROR
        description: 'An authentication error occurred. Most commonly, the request had

          a missing, malformed, or otherwise invalid `Authorization` header.'
      - name: INVALID_REQUEST_ERROR
        description: 'The request was invalid. Most commonly, a required parameter was

          missing, or a provided parameter had an invalid value.'
      - name: RATE_LIMIT_ERROR
        description: 'Your application reached the Square API rate limit. You might receive this error if your application sends a high number of requests

          to Square APIs in a short period of time.


          Your application should monitor responses for `429 RATE_LIMITED` errors and use a retry mechanism with an [exponential backoff](https://en.wikipedia.org/wiki/Exponential_backoff)

          schedule to resend the requests at an increasingly slower rate. It is also a good practice to use a randomized delay (jitter) in your retry schedule.'
      - name: PAYMENT_METHOD_ERROR
        description: 'An error occurred while processing a payment method. Most commonly,

          the details of the payment method were invalid (such as a card''s CVV

          or expiration date).'
      - name: REFUND_ERROR
        description: An error occurred while attempting to process a refund.
      - name: MERCHANT_SUBSCRIPTION_ERROR
        description: An error occurred when checking a merchant subscription status
      - name: EXTERNAL_VENDOR_ERROR
        description: An error that is returned from an external vendor's API
      description: 'Indicates which high-level category of error has occurred during a

        request to the Connect API.'
