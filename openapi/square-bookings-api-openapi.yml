openapi: 3.0.0
info:
  version: '2.0'
  title: Square ApplePay Bookings API
  description: 'Supercharge Square for sellers of every size. Our entire connected commerce platform  from elegant hardware to a rich suite of Square APIs  is yours to build with. Whether youre developing an app or composing a bespoke solution, this is the place to make it happen. '
  termsOfService: https://connect.squareup.com/tos
  contact:
    name: Square Developer Platform
    email: developers@squareup.com
    url: https://squareup.com/developers
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  externalDocs:
    description: 'Read the official documentation here:'
    url: https://docs.connect.squareup.com/
  x-server-configuration:
    default-environment: production
    default-server: default
    environments:
    - name: production
      servers:
      - name: default
        url: https://connect.squareup.com
    - name: sandbox
      servers:
      - name: default
        url: https://connect.squareupsandbox.com
    - name: custom
      servers:
      - name: default
        url: '{custom_url}'
    parameters:
    - name: custom_url
      description: Sets the base URL requests are made to. Defaults to `https://connect.squareup.com`
      type: string
      example: https://connect.squareup.com
  x-square-generic-error-codes:
  - ACCESS_TOKEN_EXPIRED
  - ACCESS_TOKEN_REVOKED
  - API_VERSION_INCOMPATIBLE
  - APPLICATION_DISABLED
  - ARRAY_EMPTY
  - ARRAY_LENGTH_TOO_LONG
  - ARRAY_LENGTH_TOO_SHORT
  - BAD_CERTIFICATE
  - BAD_GATEWAY
  - BAD_REQUEST
  - CONFLICT
  - CONFLICTING_PARAMETERS
  - CURRENCY_MISMATCH
  - EXPECTED_ARRAY
  - EXPECTED_BASE64_ENCODED_BYTE_ARRAY
  - EXPECTED_BOOLEAN
  - EXPECTED_FLOAT
  - EXPECTED_INTEGER
  - EXPECTED_JSON_BODY
  - EXPECTED_MAP
  - EXPECTED_OBJECT
  - EXPECTED_STRING
  - FORBIDDEN
  - GATEWAY_TIMEOUT
  - GONE
  - IDEMPOTENCY_KEY_REUSED
  - INCORRECT_TYPE
  - INSUFFICIENT_SCOPES
  - INTERNAL_SERVER_ERROR
  - INVALID_ARRAY_VALUE
  - INVALID_CONTENT_TYPE
  - INVALID_CURSOR
  - INVALID_ENUM_VALUE
  - INVALID_FORM_VALUE
  - INVALID_SORT_ORDER
  - INVALID_SQUARE_VERSION_FORMAT
  - INVALID_TIME
  - INVALID_TIME_RANGE
  - INVALID_VALUE
  - LOCATION_MISMATCH
  - MAP_KEY_LENGTH_TOO_LONG
  - MAP_KEY_LENGTH_TOO_SHORT
  - MERCHANT_SUBSCRIPTION_NOT_FOUND
  - METHOD_NOT_ALLOWED
  - MISSING_REQUIRED_PARAMETER
  - NOT_ACCEPTABLE
  - NOT_FOUND
  - NOT_IMPLEMENTED
  - NO_FIELDS_SET
  - RATE_LIMITED
  - REQUEST_ENTITY_TOO_LARGE
  - REQUEST_TIMEOUT
  - SANDBOX_NOT_SUPPORTED
  - SERVICE_UNAVAILABLE
  - TOO_MANY_MAP_ENTRIES
  - UNAUTHORIZED
  - UNEXPECTED_VALUE
  - UNKNOWN_BODY_PARAMETER
  - UNKNOWN_QUERY_PARAMETER
  - UNPROCESSABLE_ENTITY
  - UNSUPPORTED_MEDIA_TYPE
  - V1_ACCESS_TOKEN
  - V1_APPLICATION
  - VALUE_EMPTY
  - VALUE_REGEX_MISMATCH
  - VALUE_TOO_HIGH
  - VALUE_TOO_LONG
  - VALUE_TOO_LOW
  - VALUE_TOO_SHORT
servers:
- url: https://connect.squareup.com
  variables: {}
tags:
- name: Bookings
paths:
  /v2/bookings:
    get:
      tags:
      - Bookings
      summary: Square List Bookings
      operationId: ListBookings
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Retrieve a collection of bookings.


        To call this endpoint with buyer-level permissions, set `APPOINTMENTS_READ` for the OAuth scope.

        To call this endpoint with seller-level permissions, set `APPOINTMENTS_ALL_READ` and `APPOINTMENTS_READ` for the OAuth scope.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_READ
      parameters:
      - name: limit
        description: The maximum number of results per page to return in a paged response.
        schema:
          type: integer
        in: query
        required: false
      - name: cursor
        description: The pagination cursor from the preceding response to return the next page of the results. Do not set this when retrieving the first page of the results.
        schema:
          type: string
        in: query
        required: false
      - name: customer_id
        description: The [customer](entity:Customer) for whom to retrieve bookings. If this is not set, bookings for all customers are retrieved.
        schema:
          type: string
        in: query
        required: false
      - name: team_member_id
        description: The team member for whom to retrieve bookings. If this is not set, bookings of all members are retrieved.
        schema:
          type: string
        in: query
        required: false
      - name: location_id
        description: The location for which to retrieve bookings. If this is not set, all locations' bookings are retrieved.
        schema:
          type: string
        in: query
        required: false
      - name: start_at_min
        description: The RFC 3339 timestamp specifying the earliest of the start time. If this is not set, the current time is used.
        schema:
          type: string
        in: query
        required: false
      - name: start_at_max
        description: The RFC 3339 timestamp specifying the latest of the start time. If this is not set, the time of 31 days after `start_at_min` is used.
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBookingsResponse'
    post:
      tags:
      - Bookings
      summary: Square Create Booking
      operationId: CreateBooking
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Creates a booking.


        The required input must include the following:

        - `Booking.location_id`

        - `Booking.start_at`

        - `Booking.AppointmentSegment.team_member_id`

        - `Booking.AppointmentSegment.service_variation_id`

        - `Booking.AppointmentSegment.service_variation_version`


        To call this endpoint with buyer-level permissions, set `APPOINTMENTS_WRITE` for the OAuth scope.

        To call this endpoint with seller-level permissions, set `APPOINTMENTS_ALL_WRITE` and `APPOINTMENTS_WRITE` for the OAuth scope.


        For calls to this endpoint with seller-level permissions to succeed, the seller must have subscribed to *Appointments Plus*

        or *Appointments Premium*.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_WRITE
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBookingResponse'
  /v2/bookings/availability/search:
    post:
      tags:
      - Bookings
      summary: Square Search Availability
      operationId: SearchAvailability
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Searches for availabilities for booking.


        To call this endpoint with buyer-level permissions, set `APPOINTMENTS_READ` for the OAuth scope.

        To call this endpoint with seller-level permissions, set `APPOINTMENTS_ALL_READ` and `APPOINTMENTS_READ` for the OAuth scope.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_READ
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAvailabilityRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAvailabilityResponse'
  /v2/bookings/bulk-retrieve:
    post:
      tags:
      - Bookings
      summary: Square Bulk Retrieve Bookings
      operationId: BulkRetrieveBookings
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Bulk-Retrieves a list of bookings by booking IDs.


        To call this endpoint with buyer-level permissions, set `APPOINTMENTS_READ` for the OAuth scope.

        To call this endpoint with seller-level permissions, set `APPOINTMENTS_ALL_READ` and `APPOINTMENTS_READ` for the OAuth scope.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_READ
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRetrieveBookingsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRetrieveBookingsResponse'
  /v2/bookings/business-booking-profile:
    get:
      tags:
      - Bookings
      summary: Square Retrieve Business Booking Profile
      operationId: RetrieveBusinessBookingProfile
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Retrieves a seller's booking profile.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_BUSINESS_SETTINGS_READ
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveBusinessBookingProfileResponse'
  /v2/bookings/location-booking-profiles:
    get:
      tags:
      - Bookings
      summary: Square List Location Booking Profiles
      operationId: ListLocationBookingProfiles
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Lists location booking profiles of a seller.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_BUSINESS_SETTINGS_READ
      parameters:
      - name: limit
        description: The maximum number of results to return in a paged response.
        schema:
          type: integer
        in: query
        required: false
      - name: cursor
        description: The pagination cursor from the preceding response to return the next page of the results. Do not set this when retrieving the first page of the results.
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLocationBookingProfilesResponse'
  /v2/bookings/location-booking-profiles/{location_id}:
    get:
      tags:
      - Bookings
      summary: Square Retrieve Location Booking Profile
      operationId: RetrieveLocationBookingProfile
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Retrieves a seller's location booking profile.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_BUSINESS_SETTINGS_READ
      parameters:
      - name: location_id
        description: The ID of the location to retrieve the booking profile.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveLocationBookingProfileResponse'
  /v2/bookings/team-member-booking-profiles:
    get:
      tags:
      - Bookings
      summary: Square List Team Member Booking Profiles
      operationId: ListTeamMemberBookingProfiles
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Lists booking profiles for team members.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_BUSINESS_SETTINGS_READ
      parameters:
      - name: bookable_only
        description: Indicates whether to include only bookable team members in the returned result (`true`) or not (`false`).
        schema:
          type: boolean
          default: false
        in: query
        required: false
      - name: limit
        description: The maximum number of results to return in a paged response.
        schema:
          type: integer
        in: query
        required: false
      - name: cursor
        description: The pagination cursor from the preceding response to return the next page of the results. Do not set this when retrieving the first page of the results.
        schema:
          type: string
        in: query
        required: false
      - name: location_id
        description: Indicates whether to include only team members enabled at the given location in the returned result.
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTeamMemberBookingProfilesResponse'
  /v2/bookings/team-member-booking-profiles/bulk-retrieve:
    post:
      tags:
      - Bookings
      summary: Square Bulk Retrieve Team Member Booking Profiles
      operationId: BulkRetrieveTeamMemberBookingProfiles
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Retrieves one or more team members' booking profiles.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_BUSINESS_SETTINGS_READ
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRetrieveTeamMemberBookingProfilesRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRetrieveTeamMemberBookingProfilesResponse'
  /v2/bookings/team-member-booking-profiles/{team_member_id}:
    get:
      tags:
      - Bookings
      summary: Square Retrieve Team Member Booking Profile
      operationId: RetrieveTeamMemberBookingProfile
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Retrieves a team member's booking profile.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_BUSINESS_SETTINGS_READ
      parameters:
      - name: team_member_id
        description: The ID of the team member to retrieve.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveTeamMemberBookingProfileResponse'
  /v2/bookings/{booking_id}:
    get:
      tags:
      - Bookings
      summary: Square Retrieve Booking
      operationId: RetrieveBooking
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Retrieves a booking.


        To call this endpoint with buyer-level permissions, set `APPOINTMENTS_READ` for the OAuth scope.

        To call this endpoint with seller-level permissions, set `APPOINTMENTS_ALL_READ` and `APPOINTMENTS_READ` for the OAuth scope.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_READ
      parameters:
      - name: booking_id
        description: The ID of the [Booking](entity:Booking) object representing the to-be-retrieved booking.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveBookingResponse'
    put:
      tags:
      - Bookings
      summary: Square Update Booking
      operationId: UpdateBooking
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Updates a booking.


        To call this endpoint with buyer-level permissions, set `APPOINTMENTS_WRITE` for the OAuth scope.

        To call this endpoint with seller-level permissions, set `APPOINTMENTS_ALL_WRITE` and `APPOINTMENTS_WRITE` for the OAuth scope.


        For calls to this endpoint with seller-level permissions to succeed, the seller must have subscribed to *Appointments Plus*

        or *Appointments Premium*.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_WRITE
      parameters:
      - name: booking_id
        description: The ID of the [Booking](entity:Booking) object representing the to-be-updated booking.
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBookingResponse'
  /v2/bookings/{booking_id}/cancel:
    post:
      tags:
      - Bookings
      summary: Square Cancel Booking
      operationId: CancelBooking
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Cancels an existing booking.


        To call this endpoint with buyer-level permissions, set `APPOINTMENTS_WRITE` for the OAuth scope.

        To call this endpoint with seller-level permissions, set `APPOINTMENTS_ALL_WRITE` and `APPOINTMENTS_WRITE` for the OAuth scope.


        For calls to this endpoint with seller-level permissions to succeed, the seller must have subscribed to *Appointments Plus*

        or *Appointments Premium*.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - APPOINTMENTS_WRITE
      parameters:
      - name: booking_id
        description: The ID of the [Booking](entity:Booking) object representing the to-be-cancelled booking.
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelBookingResponse'
components:
  schemas:
    Address:
      type: object
      description: "Represents a postal address in a country. \nFor more information, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses)."
      x-release-status: PUBLIC
      properties:
        address_line_1:
          type: string
          description: 'The first line of the address.


            Fields that start with `address_line` provide the address''s most specific

            details, like street number, street name, and building name. They do *not*

            provide less specific details like city, state/province, or country (these

            details are provided in other fields).'
          nullable: true
        address_line_2:
          type: string
          description: The second line of the address, if any.
          nullable: true
        address_line_3:
          type: string
          description: The third line of the address, if any.
          nullable: true
        locality:
          type: string
          description: The city or town of the address. For a full list of field meanings by country, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses).
          nullable: true
        sublocality:
          type: string
          description: A civil region within the address's `locality`, if any.
          nullable: true
        sublocality_2:
          type: string
          description: A civil region within the address's `sublocality`, if any.
          nullable: true
        sublocality_3:
          type: string
          description: A civil region within the address's `sublocality_2`, if any.
          nullable: true
        administrative_district_level_1:
          type: string
          description: 'A civil entity within the address''s country. In the US, this

            is the state. For a full list of field meanings by country, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses).'
          nullable: true
        administrative_district_level_2:
          type: string
          description: 'A civil entity within the address''s `administrative_district_level_1`.

            In the US, this is the county.'
          nullable: true
        administrative_district_level_3:
          type: string
          description: 'A civil entity within the address''s `administrative_district_level_2`,

            if any.'
          nullable: true
        postal_code:
          type: string
          description: The address's postal code. For a full list of field meanings by country, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses).
          nullable: true
        country:
          $ref: '#/components/schemas/Country'
          description: 'The address''s country, in the two-letter format of ISO 3166. For example, `US` or `FR`.

            See [Country](#type-country) for possible values'
          nullable: true
        first_name:
          type: string
          description: Optional first name when it's representing recipient.
          nullable: true
        last_name:
          type: string
          description: Optional last name when it's representing recipient.
          nullable: true
