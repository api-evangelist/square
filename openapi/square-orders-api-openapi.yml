            field description to determine the meaning of the sign in a particular case.'
          format: int64
          nullable: true
        currency:
          $ref: '#/components/schemas/Currency'
          description: 'The type of currency, in __ISO 4217 format__. For example, the currency

            code for US dollars is `USD`.


            See [Currency](entity:Currency) for possible values.

            See [Currency](#type-currency) for possible values'
          nullable: true
    FulfillmentPickupDetails:
      type: object
      description: Contains details necessary to fulfill a pickup order.
      x-release-status: PUBLIC
      properties:
        recipient:
          $ref: '#/components/schemas/FulfillmentRecipient'
          description: 'Information about the person to pick up this fulfillment from a physical

            location.'
          nullable: true
        expires_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when this fulfillment expires if it is not marked in progress. The timestamp must be

            in RFC 3339 format (for example, "2016-09-04T23:59:33.123Z"). The expiration time can only be set

            up to 7 days in the future. If `expires_at` is not set, any new payments attached to the order

            are automatically completed.'
          nullable: true
        auto_complete_duration:
          type: string
          description: 'The duration of time after which an in progress pickup fulfillment is automatically moved

            to the `COMPLETED` state. The duration must be in RFC 3339 format (for example, "P1W3D").


            If not set, this pickup fulfillment remains in progress until it is canceled or completed.'
          nullable: true
        schedule_type:
          $ref: '#/components/schemas/FulfillmentPickupDetailsScheduleType'
          description: 'The schedule type of the pickup fulfillment. Defaults to `SCHEDULED`.

            See [FulfillmentPickupDetailsScheduleType](#type-fulfillmentpickupdetailsscheduletype) for possible values'
          nullable: true
        pickup_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            that represents the start of the pickup window. Must be in RFC 3339 timestamp format, e.g.,

            "2016-09-04T23:59:33.123Z".


            For fulfillments with the schedule type `ASAP`, this is automatically set

            to the current time plus the expected duration to prepare the fulfillment.'
          nullable: true
        pickup_window_duration:
          type: string
          description: 'The window of time in which the order should be picked up after the `pickup_at` timestamp.

            Must be in RFC 3339 duration format, e.g., "P1W3D". Can be used as an

            informational guideline for merchants.'
          nullable: true
        prep_time_duration:
          type: string
          description: 'The duration of time it takes to prepare this fulfillment.

            The duration must be in RFC 3339 format (for example, "P1W3D").'
          nullable: true
        note:
          type: string
          description: 'A note to provide additional instructions about the pickup

            fulfillment displayed in the Square Point of Sale application and set by the API.'
          maxLength: 500
          nullable: true
        placed_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the fulfillment was placed. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        accepted_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the fulfillment was marked in progress. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        rejected_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the fulfillment was rejected. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        ready_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the fulfillment is marked as ready for pickup. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        expired_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the fulfillment expired. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        picked_up_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the fulfillment was picked up by the recipient. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        canceled_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the fulfillment was canceled. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        cancel_reason:
          type: string
          description: 'A description of why the pickup was canceled. The maximum length: 100 characters.'
          maxLength: 100
          nullable: true
        is_curbside_pickup:
          type: boolean
          description: If set to `true`, indicates that this pickup order is for curbside pickup, not in-store pickup.
          x-release-status: BETA
          nullable: true
        curbside_pickup_details:
          $ref: '#/components/schemas/FulfillmentPickupDetailsCurbsidePickupDetails'
          description: Specific details for curbside pickup. These details can only be populated if `is_curbside_pickup` is set to `true`.
          x-release-status: BETA
          nullable: true
