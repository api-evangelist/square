    CreateOrderRequest:
      type: object
      x-release-status: PUBLIC
      properties:
        order:
          $ref: '#/components/schemas/Order'
          description: 'The order to create. If this field is set, the only other top-level field that can be

            set is the `idempotency_key`.'
        idempotency_key:
          type: string
          description: 'A value you specify that uniquely identifies this

            order among orders you have created.


            If you are unsure whether a particular order was created successfully,

            you can try it again with the same idempotency key without

            worrying about creating duplicate orders.


            For more information, see [Idempotency](https://developer.squareup.com/docs/build-basics/common-api-patterns/idempotency).'
          maxLength: 192
      example:
        idempotency_key: 8193148c-9586-11e6-99f9-28cfe92138cf
        order:
          discounts:
          - name: Labor Day Sale
            percentage: '5'
            scope: ORDER
            uid: labor-day-sale
          - catalog_object_id: DB7L55ZH2BGWI4H23ULIWOQ7
            scope: ORDER
            uid: membership-discount
          - amount_money:
              amount: 100
              currency: USD
            name: Sale - $1.00 off
            scope: LINE_ITEM
            uid: one-dollar-off
          line_items:
          - base_price_money:
              amount: 1599
              currency: USD
            name: New York Strip Steak
            quantity: '1'
          - applied_discounts:
            - discount_uid: one-dollar-off
            catalog_object_id: BEMYCSMIJL46OCDV4KYIKXIB
            modifiers:
            - catalog_object_id: CHQX7Y4KY6N5KINJKZCFURPZ
            quantity: '2'
          location_id: 057P5VYJ4A5X1
