        description: 'The service charge is applied after discounts, but before

          taxes.'
      - name: TOTAL_PHASE
        description: 'The service charge is applied after all discounts and taxes

          are applied.'
      - name: APPORTIONED_PERCENTAGE_PHASE
        description: 'The service charge is calculated as a compounding adjustment

          after any discounts, but before amount based apportioned service charges

          and any tax considerations.'
      - name: APPORTIONED_AMOUNT_PHASE
        description: 'The service charge is calculated as a compounding adjustment

          after any discounts and percentage based apportioned service charges,

          but before any tax considerations.'
      description: 'Represents a phase in the process of calculating order totals.

        Service charges are applied after the indicated phase.


        [Read more about how order totals are calculated.](https://developer.squareup.com/docs/orders-api/how-it-works#how-totals-are-calculated)'
      x-release-status: PUBLIC
    OrderLineItemAppliedTax:
      type: object
      description: 'Represents an applied portion of a tax to a line item in an order.


        Order-scoped taxes automatically include the applied taxes in each line item.

        Line item taxes must be referenced from any applicable line items.

        The corresponding applied money is automatically computed, based on the

        set of participating line items.'
      x-release-status: BETA
      required:
      - tax_uid
      properties:
        uid:
          type: string
          description: A unique ID that identifies the applied tax only within this order.
          maxLength: 60
          nullable: true
        tax_uid:
          type: string
          description: 'The `uid` of the tax for which this applied tax represents. It must reference

            a tax present in the `order.taxes` field.


            This field is immutable. To change which taxes apply to a line item, delete and add a new

            `OrderLineItemAppliedTax`.'
          minLength: 1
          maxLength: 60
        applied_money:
          $ref: '#/components/schemas/Money'
          description: The amount of money applied by the tax to the line item.
          readOnly: true
    ErrorCategory:
      type: string
      enum:
      - API_ERROR
      - AUTHENTICATION_ERROR
      - INVALID_REQUEST_ERROR
      - RATE_LIMIT_ERROR
      - PAYMENT_METHOD_ERROR
      - REFUND_ERROR
      - MERCHANT_SUBSCRIPTION_ERROR
      - EXTERNAL_VENDOR_ERROR
      x-enum-elements:
      - name: API_ERROR
        description: An error occurred with the Connect API itself.
      - name: AUTHENTICATION_ERROR
        description: 'An authentication error occurred. Most commonly, the request had

          a missing, malformed, or otherwise invalid `Authorization` header.'
      - name: INVALID_REQUEST_ERROR
        description: 'The request was invalid. Most commonly, a required parameter was

          missing, or a provided parameter had an invalid value.'
      - name: RATE_LIMIT_ERROR
        description: 'Your application reached the Square API rate limit. You might receive this error if your application sends a high number of requests

          to Square APIs in a short period of time.


          Your application should monitor responses for `429 RATE_LIMITED` errors and use a retry mechanism with an [exponential backoff](https://en.wikipedia.org/wiki/Exponential_backoff)

          schedule to resend the requests at an increasingly slower rate. It is also a good practice to use a randomized delay (jitter) in your retry schedule.'
      - name: PAYMENT_METHOD_ERROR
        description: 'An error occurred while processing a payment method. Most commonly,

          the details of the payment method were invalid (such as a card''s CVV

          or expiration date).'
      - name: REFUND_ERROR
        description: An error occurred while attempting to process a refund.
      - name: MERCHANT_SUBSCRIPTION_ERROR
        description: An error occurred when checking a merchant subscription status
      - name: EXTERNAL_VENDOR_ERROR
        description: An error that is returned from an external vendor's API
      description: 'Indicates which high-level category of error has occurred during a

        request to the Connect API.'
