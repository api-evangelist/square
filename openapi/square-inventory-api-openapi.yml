    InventoryState:
      type: string
      enum:
      - CUSTOM
      - IN_STOCK
      - SOLD
      - RETURNED_BY_CUSTOMER
      - RESERVED_FOR_SALE
      - SOLD_ONLINE
      - ORDERED_FROM_VENDOR
      - RECEIVED_FROM_VENDOR
      - IN_TRANSIT_TO
      - NONE
      - WASTE
      - UNLINKED_RETURN
      - COMPOSED
      - DECOMPOSED
      - SUPPORTED_BY_NEWER_VERSION
      - IN_TRANSIT
      x-enum-elements:
      - name: CUSTOM
        description: 'The related quantity of items are in a custom state. **READ-ONLY**:

          the Inventory API cannot move quantities to or from this state.'
      - name: IN_STOCK
        description: The related quantity of items are on hand and available for sale.
      - name: SOLD
        description: 'The related quantity of items were sold as part of an itemized

          transaction. Quantities in the `SOLD` state are no longer tracked.'
      - name: RETURNED_BY_CUSTOMER
        description: 'The related quantity of items were returned through the Square Point

          of Sale application, but are not yet available for sale. **READ-ONLY**:

          the Inventory API cannot move quantities to or from this state.'
      - name: RESERVED_FOR_SALE
        description: 'The related quantity of items are on hand, but not currently

          available for sale. **READ-ONLY**: the Inventory API cannot move

          quantities to or from this state.'
      - name: SOLD_ONLINE
        description: 'The related quantity of items were sold online. **READ-ONLY**: the

          Inventory API cannot move quantities to or from this state.'
      - name: ORDERED_FROM_VENDOR
        description: 'The related quantity of items were ordered from a vendor but not yet

          received. **READ-ONLY**: the Inventory API cannot move quantities to or

          from this state.'
      - name: RECEIVED_FROM_VENDOR
        description: 'The related quantity of items were received from a vendor but are

          not yet available for sale. **READ-ONLY**: the Inventory API cannot move

          quantities to or from this state.'
      - name: IN_TRANSIT_TO
        description: 'Replaced by `IN_TRANSIT` to represent quantities

          of items that are in transit between locations.'
      - name: NONE
        description: 'A placeholder indicating that the related quantity of items are not

          currently tracked in Square. Transferring quantities from the `NONE` state

          to a tracked state (e.g., `IN_STOCK`) introduces stock into the system.'
      - name: WASTE
        description: 'The related quantity of items are lost or damaged and cannot be

          sold.'
      - name: UNLINKED_RETURN
        description: 'The related quantity of items were returned but not linked to a

          previous transaction. Unlinked returns are not tracked in Square.

          Transferring a quantity from `UNLINKED_RETURN` to a tracked state (e.g.,

          `IN_STOCK`) introduces new stock into the system.'
      - name: COMPOSED
        description: The related quantity of items that are part of a composition consisting one or more components.
      - name: DECOMPOSED
        description: The related quantity of items that are part of a component.
      - name: SUPPORTED_BY_NEWER_VERSION
        description: This state is not supported by this version of the Square API. We recommend that you upgrade the client to use the appropriate version of the Square API supporting this state.
      - name: IN_TRANSIT
        description: The related quantity of items are in transit between locations. **READ-ONLY:** the Inventory API cannot currently be used to move quantities to or from this inventory state.
      description: Indicates the state of a tracked item quantity in the lifecycle of goods.
      x-release-status: PUBLIC
    InventoryPhysicalCount:
      type: object
      description: 'Represents the quantity of an item variation that is physically present

        at a specific location, verified by a seller or a seller''s employee. For example,

        a physical count might come from an employee counting the item variations on

        hand or from syncing with an external system.'
      x-release-status: PUBLIC
      properties:
        id:
          type: string
          description: 'A unique Square-generated ID for the

            [InventoryPhysicalCount](entity:InventoryPhysicalCount).'
          maxLength: 100
        reference_id:
          type: string
          description: 'An optional ID provided by the application to tie the

            [InventoryPhysicalCount](entity:InventoryPhysicalCount) to an external

            system.'
          maxLength: 255
          nullable: true
        catalog_object_id:
          type: string
          description: 'The Square-generated ID of the

            [CatalogObject](entity:CatalogObject) being tracked.'
          maxLength: 100
          nullable: true
        catalog_object_type:
          type: string
          description: "The [type](entity:CatalogObjectType) of the [CatalogObject](entity:CatalogObject) being tracked. \n\nThe Inventory API supports setting and reading the `\"catalog_object_type\": \"ITEM_VARIATION\"` field value. \nIn addition, it can also read the `\"catalog_object_type\": \"ITEM\"` field value that is set by the Square Restaurants app."
          maxLength: 14
          nullable: true
        state:
          $ref: '#/components/schemas/InventoryState'
          description: 'The current [inventory state](entity:InventoryState) for the related

            quantity of items.

            See [InventoryState](#type-inventorystate) for possible values'
          nullable: true
