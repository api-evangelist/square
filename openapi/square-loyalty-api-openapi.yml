          readOnly: true
        catalog_object_ids:
          type: array
          items:
            type: string
          description: 'The list of catalog objects to which this reward can be applied. They are either all item-variation ids or category ids, depending on the `type` field.

            DEPRECATED at version 2020-12-16. You can find this information in the `product_set_data.product_ids_any` field

            of the `PRODUCT_SET` catalog object referenced by the pricing rule.'
          readOnly: true
        fixed_discount_money:
          $ref: '#/components/schemas/Money'
          description: "The amount of the discount. Present if `discount_type` is `FIXED_AMOUNT`. For example, $5 off.\nDEPRECATED at version 2020-12-16. You can find this information in the `discount_data.amount_money` field of the \n`DISCOUNT` catalog object referenced by the pricing rule."
          readOnly: true
        max_discount_money:
          $ref: '#/components/schemas/Money'
          description: 'When `discount_type` is `FIXED_PERCENTAGE`, the maximum discount amount that can be applied.

