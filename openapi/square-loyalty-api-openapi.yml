    LoyaltyProgramRewardTier:
      type: object
      description: Represents a reward tier in a loyalty program. A reward tier defines how buyers can redeem points for a reward, such as the number of points required and the value and scope of the discount. A loyalty program can offer multiple reward tiers.
      x-release-status: PUBLIC
      required:
      - points
      - pricing_rule_reference
      properties:
        id:
          type: string
          description: The Square-assigned ID of the reward tier.
          maxLength: 36
          readOnly: true
        points:
          type: integer
          description: The points exchanged for the reward tier.
          minimum: 1
        name:
          type: string
          description: The name of the reward tier.
          readOnly: true
        definition:
          $ref: '#/components/schemas/LoyaltyProgramRewardDefinition'
          description: 'Provides details about the reward tier definition.

            DEPRECATED at version 2020-12-16. Replaced by the `pricing_rule_reference` field.'
          readOnly: true
          x-release-status: DEPRECATED
        created_at:
          type: string
          description: The timestamp when the reward tier was created, in RFC 3339 format.
          readOnly: true
        pricing_rule_reference:
          $ref: '#/components/schemas/CatalogObjectReference'
          description: 'A reference to the specific version of a `PRICING_RULE` catalog object that contains information about the reward tier discount.


            Use `object_id` and `catalog_version` with the [RetrieveCatalogObject](api-endpoint:Catalog-RetrieveCatalogObject) endpoint

            to get discount details. Make sure to set `include_related_objects` to true in the request to retrieve all catalog objects

            that define the discount. For more information, see [Getting discount details for a reward tier](https://developer.squareup.com/docs/loyalty-api/loyalty-rewards#get-discount-details).'
    SearchLoyaltyRewardsRequestLoyaltyRewardQuery:
