    LoyaltyPromotion:
      type: object
      description: 'Represents a promotion for a [loyalty program](entity:LoyaltyProgram). Loyalty promotions enable buyers

        to earn extra points on top of those earned from the base program.


        A loyalty program can have a maximum of 10 loyalty promotions with an `ACTIVE` or `SCHEDULED` status.'
      x-release-status: PUBLIC
      required:
      - name
      - incentive
      - available_time
      properties:
        id:
          type: string
          description: The Square-assigned ID of the promotion.
          minLength: 1
          maxLength: 255
          readOnly: true
        name:
          type: string
          description: The name of the promotion.
          minLength: 1
          maxLength: 70
        incentive:
          $ref: '#/components/schemas/LoyaltyPromotionIncentive'
          description: 'The points incentive for the promotion. This field defines whether promotion points

            are earned by multiplying base program points or by adding a specified number of points.'
        available_time:
          $ref: '#/components/schemas/LoyaltyPromotionAvailableTimeData'
          description: The scheduling information that defines when purchases can qualify to earn points from an `ACTIVE` promotion.
        trigger_limit:
          $ref: '#/components/schemas/LoyaltyPromotionTriggerLimit'
          description: 'The number of times a buyer can earn promotion points during a specified interval.

            If not specified, buyers can trigger the promotion an unlimited number of times.'
          nullable: true
        status:
          $ref: '#/components/schemas/LoyaltyPromotionStatus'
          description: 'The current status of the promotion.

            See [LoyaltyPromotionStatus](#type-loyaltypromotionstatus) for possible values'
          readOnly: true
        created_at:
          type: string
          description: The timestamp of when the promotion was created, in RFC 3339 format.
          readOnly: true
        canceled_at:
          type: string
          description: The timestamp of when the promotion was canceled, in RFC 3339 format.
          readOnly: true
        updated_at:
          type: string
          description: The timestamp when the promotion was last updated, in RFC 3339 format.
          readOnly: true
        loyalty_program_id:
          type: string
          description: The ID of the [loyalty program](entity:LoyaltyProgram) associated with the promotion.
          readOnly: true
        minimum_spend_amount_money:
          $ref: '#/components/schemas/Money'
          description: The minimum purchase amount required to earn promotion points. If specified, this amount is positive.
          nullable: true
        qualifying_item_variation_ids:
          type: array
          items:
            type: string
          description: 'The IDs of any qualifying `ITEM_VARIATION` [catalog objects](entity:CatalogObject). If specified,

            the purchase must include at least one of these items to qualify for the promotion.


            This option is valid only if the base loyalty program uses a `VISIT` or `SPEND` accrual rule.

            With `SPEND` accrual rules, make sure that qualifying promotional items are not excluded.


            You can specify `qualifying_item_variation_ids` or `qualifying_category_ids` for a given promotion, but not both.'
          nullable: true
        qualifying_category_ids:
          type: array
          items:
            type: string
          description: 'The IDs of any qualifying `CATEGORY` [catalog objects](entity:CatalogObject). If specified,

            the purchase must include at least one item from one of these categories to qualify for the promotion.


            This option is valid only if the base loyalty program uses a `VISIT` or `SPEND` accrual rule.

            With `SPEND` accrual rules, make sure that qualifying promotional items are not excluded.


            You can specify `qualifying_category_ids` or `qualifying_item_variation_ids` for a promotion, but not both.'
          nullable: true
    Money:
      type: object
      description: 'Represents an amount of money. `Money` fields can be signed or unsigned.

        Fields that do not explicitly define whether they are signed or unsigned are

        considered unsigned and can only hold positive amounts. For signed fields, the

        sign of the value indicates the purpose of the money transfer. See

        [Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts)

        for more information.'
      x-release-status: PUBLIC
      properties:
        amount:
          type: integer
          description: 'The amount of money, in the smallest denomination of the currency

            indicated by `currency`. For example, when `currency` is `USD`, `amount` is

            in cents. Monetary amounts can be positive or negative. See the specific

            field description to determine the meaning of the sign in a particular case.'
          format: int64
          nullable: true
        currency:
          $ref: '#/components/schemas/Currency'
          description: 'The type of currency, in __ISO 4217 format__. For example, the currency

            code for US dollars is `USD`.


            See [Currency](entity:Currency) for possible values.

            See [Currency](#type-currency) for possible values'
          nullable: true
