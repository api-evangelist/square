    LoyaltyPromotionTriggerLimit:
      type: object
      description: 'Represents the number of times a buyer can earn points during a [loyalty promotion](entity:LoyaltyPromotion).

        If this field is not set, buyers can trigger the promotion an unlimited number of times to earn points during

        the time that the promotion is available.


        A purchase that is disqualified from earning points because of this limit might qualify for another active promotion.'
      x-release-status: PUBLIC
      required:
      - times
      properties:
        times:
          type: integer
          description: The maximum number of times a buyer can trigger the promotion during the specified `interval`.
          minimum: 1
          maximum: 30
        interval:
          $ref: '#/components/schemas/LoyaltyPromotionTriggerLimitInterval'
          description: 'The time period the limit applies to.

            See [LoyaltyPromotionTriggerLimitInterval](#type-loyaltypromotiontriggerlimitinterval) for possible values'
          nullable: true
    LoyaltyPromotionIncentive:
      type: object
      description: 'Represents how points for a [loyalty promotion](entity:LoyaltyPromotion) are calculated,

        either by multiplying the points earned from the base program or by adding a specified number

        of points to the points earned from the base program.'
      x-release-status: PUBLIC
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/LoyaltyPromotionIncentiveType'
          description: 'The type of points incentive.

            See [LoyaltyPromotionIncentiveType](#type-loyaltypromotionincentivetype) for possible values'
        points_multiplier_data:
          $ref: '#/components/schemas/LoyaltyPromotionIncentivePointsMultiplierData'
          description: Additional data for a `POINTS_MULTIPLIER` incentive type.
          nullable: true
        points_addition_data:
          $ref: '#/components/schemas/LoyaltyPromotionIncentivePointsAdditionData'
          description: Additional data for a `POINTS_ADDITION` incentive type.
          nullable: true
