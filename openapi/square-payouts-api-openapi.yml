servers:
- url: https://connect.squareup.com
  variables: {}
tags:
- name: Payouts
paths:
  /v2/payouts:
    get:
      tags:
      - Payouts
      summary: Square List Payouts
      operationId: ListPayouts
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Retrieves a list of all payouts for the default location.

        You can filter payouts by location ID, status, time range, and order them in ascending or descending order.

        To call this endpoint, set `PAYOUTS_READ` for the OAuth scope.'
      x-release-status: PUBLIC
      security:
      - oauth2: []
      parameters:
      - name: location_id
        description: 'The ID of the location for which to list the payouts.

          By default, payouts are returned for the default (main) location associated with the seller.'
        schema:
          type: string
        in: query
        required: false
      - name: status
        description: If provided, only payouts with the given status are returned.
        schema:
          $ref: '#/components/schemas/PayoutStatus'
        in: query
        required: false
      - name: begin_time
        description: 'The timestamp for the beginning of the payout creation time, in RFC 3339 format.

          Inclusive. Default: The current time minus one year.'
        schema:
          type: string
        in: query
        required: false
      - name: end_time
        description: 'The timestamp for the end of the payout creation time, in RFC 3339 format.

          Default: The current time.'
        schema:
          type: string
        in: query
        required: false
      - name: sort_order
        description: The order in which payouts are listed.
        schema:
          $ref: '#/components/schemas/SortOrder'
        in: query
        required: false
      - name: cursor
        description: 'A pagination cursor returned by a previous call to this endpoint.

          Provide this cursor to retrieve the next set of results for the original query.

          For more information, see [Pagination](https://developer.squareup.com/docs/build-basics/common-api-patterns/pagination).

          If request parameters change between requests, subsequent results may contain duplicates or missing records.'
        schema:
          type: string
        in: query
        required: false
      - name: limit
        description: 'The maximum number of results to be returned in a single page.

          It is possible to receive fewer results than the specified limit on a given page.

          The default value of 100 is also the maximum allowed value. If the provided value is

          greater than 100, it is ignored and the default value is used instead.

          Default: `100`'
        schema:
          type: integer
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayoutsResponse'
  /v2/payouts/{payout_id}:
    get:
      tags:
      - Payouts
      summary: Square Get Payout
      operationId: GetPayout
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Retrieves details of a specific payout identified by a payout ID.

        To call this endpoint, set `PAYOUTS_READ` for the OAuth scope.'
      x-release-status: PUBLIC
      security:
      - oauth2: []
      parameters:
      - name: payout_id
        description: The ID of the payout to retrieve the information for.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayoutResponse'
  /v2/payouts/{payout_id}/payout-entries:
    get:
      tags:
      - Payouts
      summary: Square List Payout Entries
      operationId: ListPayoutEntries
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Retrieves a list of all payout entries for a specific payout.

        To call this endpoint, set `PAYOUTS_READ` for the OAuth scope.'
      x-release-status: PUBLIC
      security:
      - oauth2: []
      parameters:
      - name: payout_id
        description: The ID of the payout to retrieve the information for.
        schema:
          type: string
        in: path
        required: true
      - name: sort_order
        description: The order in which payout entries are listed.
        schema:
          $ref: '#/components/schemas/SortOrder'
        in: query
        required: false
      - name: cursor
        description: 'A pagination cursor returned by a previous call to this endpoint.

          Provide this cursor to retrieve the next set of results for the original query.

          For more information, see [Pagination](https://developer.squareup.com/docs/build-basics/common-api-patterns/pagination).

          If request parameters change between requests, subsequent results may contain duplicates or missing records.'
        schema:
          type: string
        in: query
        required: false
      - name: limit
        description: 'The maximum number of results to be returned in a single page.

          It is possible to receive fewer results than the specified limit on a given page.

          The default value of 100 is also the maximum allowed value. If the provided value is

          greater than 100, it is ignored and the default value is used instead.

          Default: `100`'
        schema:
          type: integer
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayoutEntriesResponse'
components:
  schemas:
    Destination:
      type: object
      description: Information about the destination against which the payout was made.
      x-release-status: PUBLIC
      properties:
        type:
          $ref: '#/components/schemas/DestinationType'
          description: 'Type of the destination such as a bank account or debit card.

            See [DestinationType](#type-destinationtype) for possible values'
          nullable: true
        id:
          type: string
          description: Square issued unique ID (also known as the instrument ID) associated with this destination.
    PayoutStatus:
      type: string
      enum:
      - SENT
      - FAILED
      - PAID
      x-enum-elements:
      - name: SENT
        description: Indicates that the payout was successfully sent to the banking destination.
      - name: FAILED
        description: Indicates that the payout was rejected by the banking destination.
      - name: PAID
        description: Indicates that the payout has successfully completed.
      description: Payout status types
      x-release-status: PUBLIC
    ErrorCategory:
      type: string
      enum:
      - API_ERROR
      - AUTHENTICATION_ERROR
      - INVALID_REQUEST_ERROR
      - RATE_LIMIT_ERROR
      - PAYMENT_METHOD_ERROR
      - REFUND_ERROR
      - MERCHANT_SUBSCRIPTION_ERROR
      - EXTERNAL_VENDOR_ERROR
      x-enum-elements:
      - name: API_ERROR
        description: An error occurred with the Connect API itself.
      - name: AUTHENTICATION_ERROR
        description: 'An authentication error occurred. Most commonly, the request had

          a missing, malformed, or otherwise invalid `Authorization` header.'
      - name: INVALID_REQUEST_ERROR
        description: 'The request was invalid. Most commonly, a required parameter was

          missing, or a provided parameter had an invalid value.'
      - name: RATE_LIMIT_ERROR
        description: 'Your application reached the Square API rate limit. You might receive this error if your application sends a high number of requests

          to Square APIs in a short period of time.


          Your application should monitor responses for `429 RATE_LIMITED` errors and use a retry mechanism with an [exponential backoff](https://en.wikipedia.org/wiki/Exponential_backoff)

          schedule to resend the requests at an increasingly slower rate. It is also a good practice to use a randomized delay (jitter) in your retry schedule.'
      - name: PAYMENT_METHOD_ERROR
        description: 'An error occurred while processing a payment method. Most commonly,

          the details of the payment method were invalid (such as a card''s CVV

          or expiration date).'
      - name: REFUND_ERROR
        description: An error occurred while attempting to process a refund.
      - name: MERCHANT_SUBSCRIPTION_ERROR
        description: An error occurred when checking a merchant subscription status
      - name: EXTERNAL_VENDOR_ERROR
        description: An error that is returned from an external vendor's API
      description: 'Indicates which high-level category of error has occurred during a

        request to the Connect API.'
      x-release-status: PUBLIC
    ErrorCode:
      type: string
      enum:
