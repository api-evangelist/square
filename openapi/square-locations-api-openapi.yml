    CreateLocationResponse:
      type: object
      description: The response object returned by the [CreateLocation](api-endpoint:Locations-CreateLocation) endpoint.
      x-release-status: PUBLIC
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: Information about [errors](https://developer.squareup.com/docs/build-basics/handling-errors) encountered during the request.
        location:
          $ref: '#/components/schemas/Location'
          description: The newly created `Location` object.
      example:
        location:
          address:
            address_line_1: 1234 Peachtree St. NE
            administrative_district_level_1: GA
            locality: Atlanta
            postal_code: '30309'
          business_name: Jet Fuel Coffee
          capabilities:
          - CREDIT_CARD_PROCESSING
          coordinates:
            latitude: 33.7889
            longitude: -84.3841
          country: US
          created_at: '2022-02-19T17:58:25Z'
          currency: USD
          description: Midtown Atlanta store
          id: 3Z4V4WHQK64X9
          language_code: en-US
          mcc: '7299'
          merchant_id: 3MYCJG5GVYQ8Q
          name: Midtown
          status: ACTIVE
          timezone: America/New_York
          type: PHYSICAL
    CreateLocationRequest:
      type: object
      description: The request object for the [CreateLocation](api-endpoint:Locations-CreateLocation) endpoint.
      x-release-status: PUBLIC
      properties:
        location:
          $ref: '#/components/schemas/Location'
          description: 'The initial values of the location being created. The `name` field is required and must be unique within a seller account.

            All other fields are optional, but any information you care about for the location should be included.

            The remaining fields are automatically added based on the data from the [main location](https://developer.squareup.com/docs/locations-api#about-the-main-location).'
      example:
        location:
          address:
            address_line_1: 1234 Peachtree St. NE
            administrative_district_level_1: GA
            locality: Atlanta
            postal_code: '30309'
          description: Midtown Atlanta store
          name: Midtown
    Location:
      type: object
      description: Represents one of a business' [locations](https://developer.squareup.com/docs/locations-api).
      x-release-status: PUBLIC
      properties:
        id:
          type: string
          description: A short generated string of letters and numbers that uniquely identifies this location instance.
          maxLength: 32
          readOnly: true
        name:
          type: string
          description: 'The name of the location.

            This information appears in the Seller Dashboard as the nickname.

            A location name must be unique within a seller account.'
          maxLength: 255
          nullable: true
        address:
          $ref: '#/components/schemas/Address'
          description: The physical address of the location.
          nullable: true
        timezone:
          type: string
          description: 'The [IANA time zone](https://www.iana.org/time-zones) identifier for

            the time zone of the location. For example, `America/Los_Angeles`.'
          maxLength: 30
          nullable: true
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/LocationCapability'
          description: 'The Square features that are enabled for the location.

            See [LocationCapability](entity:LocationCapability) for possible values.

            See [LocationCapability](#type-locationcapability) for possible values'
          readOnly: true
        status:
          $ref: '#/components/schemas/LocationStatus'
          description: 'The status of the location.

            See [LocationStatus](#type-locationstatus) for possible values'
          nullable: true
        created_at:
          type: string
          description: 'The time when the location was created, in RFC 3339 format.

            For more information, see [Working with Dates](https://developer.squareup.com/docs/build-basics/working-with-dates).'
          minLength: 20
          maxLength: 25
          readOnly: true
        merchant_id:
          type: string
          description: The ID of the merchant that owns the location.
          maxLength: 32
          readOnly: true
        country:
          $ref: '#/components/schemas/Country'
          description: 'The country of the location, in the two-letter format of ISO 3166. For example, `US` or `JP`.


            See [Country](entity:Country) for possible values.

            See [Country](#type-country) for possible values'
          readOnly: true
        language_code:
          type: string
          description: 'The language associated with the location, in

            [BCP 47 format](https://tools.ietf.org/html/bcp47#appendix-A).

            For more information, see [Language Preferences](https://developer.squareup.com/docs/build-basics/general-considerations/language-preferences).'
          minLength: 2
          maxLength: 5
          nullable: true
        currency:
          $ref: '#/components/schemas/Currency'
          description: 'The currency used for all transactions at this location,

            in ISO 4217 format. For example, the currency code for US dollars is `USD`.

            See [Currency](entity:Currency) for possible values.

            See [Currency](#type-currency) for possible values'
          readOnly: true
        phone_number:
          type: string
          description: The phone number of the location. For example, `+1 855-700-6000`.
          maxLength: 17
          nullable: true
        business_name:
          type: string
          description: The name of the location's overall business. This name is present on receipts and other customer-facing branding, and can be changed no more than three times in a twelve-month period.
          maxLength: 255
          nullable: true
        type:
          $ref: '#/components/schemas/LocationType'
          description: 'The type of the location.

            See [LocationType](#type-locationtype) for possible values'
          nullable: true
        website_url:
          type: string
          description: The website URL of the location.  For example, `https://squareup.com`.
          maxLength: 255
          nullable: true
        business_hours:
          $ref: '#/components/schemas/BusinessHours'
          description: The hours of operation for the location.
          nullable: true
        business_email:
          type: string
          description: The email address of the location. This can be unique to the location and is not always the email address for the business owner or administrator.
          maxLength: 255
          nullable: true
        description:
          type: string
          description: The description of the location. For example, `Main Street location`.
          maxLength: 1024
          nullable: true
