    Transaction:
      type: object
      description: 'Represents a transaction processed with Square, either with the

        Connect API or with Square Point of Sale.


        The `tenders` field of this object lists all methods of payment used to pay in

        the transaction.'
      x-release-status: DEPRECATED
      properties:
        id:
          type: string
          description: The transaction's unique ID, issued by Square payments servers.
          maxLength: 192
        location_id:
          type: string
          description: The ID of the transaction's associated location.
          maxLength: 50
          nullable: true
        created_at:
          type: string
          description: The timestamp for when the transaction was created, in RFC 3339 format.
          maxLength: 32
        tenders:
          type: array
          items:
            $ref: '#/components/schemas/Tender'
          description: The tenders used to pay in the transaction.
          nullable: true
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/Refund'
          description: Refunds that have been applied to any tender in the transaction.
          nullable: true
        reference_id:
          type: string
          description: 'If the transaction was created with the [Charge](api-endpoint:Transactions-Charge)

            endpoint, this value is the same as the value provided for the `reference_id`

            parameter in the request to that endpoint. Otherwise, it is not set.'
          maxLength: 40
          nullable: true
        product:
          $ref: '#/components/schemas/TransactionProduct'
          description: 'The Square product that processed the transaction.

            See [TransactionProduct](#type-transactionproduct) for possible values'
          nullable: true
        client_id:
          type: string
          description: 'If the transaction was created in the Square Point of Sale app, this value

            is the ID generated for the transaction by Square Point of Sale.


            This ID has no relationship to the transaction''s canonical `id`, which is

            generated by Square''s backend servers. This value is generated for bookkeeping

            purposes, in case the transaction cannot immediately be completed (for example,

            if the transaction is processed in offline mode).


            It is not currently possible with the Connect API to perform a transaction

            lookup by this value.'
          maxLength: 192
          nullable: true
        shipping_address:
          $ref: '#/components/schemas/Address'
          description: The shipping address provided in the request, if any.
          nullable: true
        order_id:
          type: string
          description: The order_id is an identifier for the order associated with this transaction, if any.
          maxLength: 192
          nullable: true
    ErrorCategory:
      type: string
      enum:
      - API_ERROR
      - AUTHENTICATION_ERROR
      - INVALID_REQUEST_ERROR
      - RATE_LIMIT_ERROR
      - PAYMENT_METHOD_ERROR
      - REFUND_ERROR
      - MERCHANT_SUBSCRIPTION_ERROR
      - EXTERNAL_VENDOR_ERROR
      x-enum-elements:
      - name: API_ERROR
        description: An error occurred with the Connect API itself.
      - name: AUTHENTICATION_ERROR
        description: 'An authentication error occurred. Most commonly, the request had

          a missing, malformed, or otherwise invalid `Authorization` header.'
      - name: INVALID_REQUEST_ERROR
        description: 'The request was invalid. Most commonly, a required parameter was

          missing, or a provided parameter had an invalid value.'
      - name: RATE_LIMIT_ERROR
        description: 'Your application reached the Square API rate limit. You might receive this error if your application sends a high number of requests

          to Square APIs in a short period of time.


          Your application should monitor responses for `429 RATE_LIMITED` errors and use a retry mechanism with an [exponential backoff](https://en.wikipedia.org/wiki/Exponential_backoff)

          schedule to resend the requests at an increasingly slower rate. It is also a good practice to use a randomized delay (jitter) in your retry schedule.'
      - name: PAYMENT_METHOD_ERROR
        description: 'An error occurred while processing a payment method. Most commonly,

          the details of the payment method were invalid (such as a card''s CVV

          or expiration date).'
      - name: REFUND_ERROR
        description: An error occurred while attempting to process a refund.
      - name: MERCHANT_SUBSCRIPTION_ERROR
        description: An error occurred when checking a merchant subscription status
      - name: EXTERNAL_VENDOR_ERROR
        description: An error that is returned from an external vendor's API
      description: 'Indicates which high-level category of error has occurred during a

        request to the Connect API.'
      x-release-status: PUBLIC
