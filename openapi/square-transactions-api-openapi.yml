openapi: 3.0.0
info:
  version: '2.0'
  title: Square ApplePay Transactions API
  description: 'Supercharge Square for sellers of every size. Our entire connected commerce platform  from elegant hardware to a rich suite of Square APIs  is yours to build with. Whether youre developing an app or composing a bespoke solution, this is the place to make it happen. '
  termsOfService: https://connect.squareup.com/tos
  contact:
    name: Square Developer Platform
    email: developers@squareup.com
    url: https://squareup.com/developers
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  externalDocs:
    description: 'Read the official documentation here:'
    url: https://docs.connect.squareup.com/
  x-server-configuration:
    default-environment: production
    default-server: default
    environments:
    - name: production
      servers:
      - name: default
        url: https://connect.squareup.com
    - name: sandbox
      servers:
      - name: default
        url: https://connect.squareupsandbox.com
    - name: custom
      servers:
      - name: default
        url: '{custom_url}'
    parameters:
    - name: custom_url
      description: Sets the base URL requests are made to. Defaults to `https://connect.squareup.com`
      type: string
      example: https://connect.squareup.com
  x-square-generic-error-codes:
  - ACCESS_TOKEN_EXPIRED
  - ACCESS_TOKEN_REVOKED
  - API_VERSION_INCOMPATIBLE
  - APPLICATION_DISABLED
  - ARRAY_EMPTY
  - ARRAY_LENGTH_TOO_LONG
  - ARRAY_LENGTH_TOO_SHORT
  - BAD_CERTIFICATE
  - BAD_GATEWAY
  - BAD_REQUEST
  - CONFLICT
  - CONFLICTING_PARAMETERS
  - CURRENCY_MISMATCH
  - EXPECTED_ARRAY
  - EXPECTED_BASE64_ENCODED_BYTE_ARRAY
  - EXPECTED_BOOLEAN
  - EXPECTED_FLOAT
  - EXPECTED_INTEGER
  - EXPECTED_JSON_BODY
  - EXPECTED_MAP
  - EXPECTED_OBJECT
  - EXPECTED_STRING
  - FORBIDDEN
  - GATEWAY_TIMEOUT
  - GONE
  - IDEMPOTENCY_KEY_REUSED
  - INCORRECT_TYPE
  - INSUFFICIENT_SCOPES
  - INTERNAL_SERVER_ERROR
  - INVALID_ARRAY_VALUE
  - INVALID_CONTENT_TYPE
  - INVALID_CURSOR
  - INVALID_ENUM_VALUE
  - INVALID_FORM_VALUE
  - INVALID_SORT_ORDER
  - INVALID_SQUARE_VERSION_FORMAT
  - INVALID_TIME
  - INVALID_TIME_RANGE
  - INVALID_VALUE
  - LOCATION_MISMATCH
  - MAP_KEY_LENGTH_TOO_LONG
  - MAP_KEY_LENGTH_TOO_SHORT
  - MERCHANT_SUBSCRIPTION_NOT_FOUND
  - METHOD_NOT_ALLOWED
  - MISSING_REQUIRED_PARAMETER
  - NOT_ACCEPTABLE
  - NOT_FOUND
  - NOT_IMPLEMENTED
  - NO_FIELDS_SET
  - RATE_LIMITED
  - REQUEST_ENTITY_TOO_LARGE
  - REQUEST_TIMEOUT
  - SANDBOX_NOT_SUPPORTED
  - SERVICE_UNAVAILABLE
  - TOO_MANY_MAP_ENTRIES
  - UNAUTHORIZED
  - UNEXPECTED_VALUE
  - UNKNOWN_BODY_PARAMETER
  - UNKNOWN_QUERY_PARAMETER
  - UNPROCESSABLE_ENTITY
  - UNSUPPORTED_MEDIA_TYPE
  - V1_ACCESS_TOKEN
  - V1_APPLICATION
  - VALUE_EMPTY
  - VALUE_REGEX_MISMATCH
  - VALUE_TOO_HIGH
  - VALUE_TOO_LONG
  - VALUE_TOO_LOW
  - VALUE_TOO_SHORT
servers:
- url: https://connect.squareup.com
  variables: {}
tags:
- name: Transactions
paths:
  /v2/locations/{location_id}/transactions:
    get:
      tags:
      - Transactions
      summary: Square List Transactions
      operationId: ListTransactions
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Lists transactions for a particular location.


        Transactions include payment information from sales and exchanges and refund

        information from returns and exchanges.


        Max results per [page](https://developer.squareup.com/docs/working-with-apis/pagination): 50'
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2019-08-15'
        retirementDate: TBD
        replacedBy: SearchOrders
        guideUrl: https://developer.squareup.com/docs/payments-api/migrate-from-transactions-api
      security:
      - oauth2:
        - PAYMENTS_READ
      parameters:
      - name: location_id
        description: The ID of the location to list transactions for.
        schema:
          type: string
        in: path
        required: true
      - name: begin_time
        description: 'The beginning of the requested reporting period, in RFC 3339 format.


          See [Date ranges](https://developer.squareup.com/docs/build-basics/working-with-dates) for details on date inclusivity/exclusivity.


          Default value: The current time minus one year.'
        schema:
          type: string
        in: query
        required: false
      - name: end_time
        description: 'The end of the requested reporting period, in RFC 3339 format.


          See [Date ranges](https://developer.squareup.com/docs/build-basics/working-with-dates) for details on date inclusivity/exclusivity.


          Default value: The current time.'
        schema:
          type: string
        in: query
        required: false
      - name: sort_order
        description: 'The order in which results are listed in the response (`ASC` for

          oldest first, `DESC` for newest first).


          Default value: `DESC`'
        schema:
          $ref: '#/components/schemas/SortOrder'
        in: query
        required: false
      - name: cursor
        description: 'A pagination cursor returned by a previous call to this endpoint.

          Provide this to retrieve the next set of results for your original query.


          See [Paginating results](https://developer.squareup.com/docs/working-with-apis/pagination) for more information.'
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
  /v2/locations/{location_id}/transactions/{transaction_id}:
    get:
      tags:
      - Transactions
      summary: Square Retrieve Transaction
      operationId: RetrieveTransaction
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Retrieves details for a single transaction.
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2019-08-15'
        retirementDate: TBD
        replacedBy: BatchRetrieveOrders
        guideUrl: https://developer.squareup.com/docs/payments-api/migrate-from-transactions-api
      security:
      - oauth2:
        - PAYMENTS_READ
      parameters:
      - name: location_id
        description: The ID of the transaction's associated location.
        schema:
          type: string
        in: path
        required: true
      - name: transaction_id
        description: The ID of the transaction to retrieve.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveTransactionResponse'
  /v2/locations/{location_id}/transactions/{transaction_id}/capture:
    post:
      tags:
      - Transactions
      summary: Square Capture Transaction
      operationId: CaptureTransaction
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Captures a transaction that was created with the [Charge](api-endpoint:Transactions-Charge)

        endpoint with a `delay_capture` value of `true`.



        See [Delayed capture transactions](https://developer.squareup.com/docs/payments/transactions/overview#delayed-capture)

        for more information.'
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2019-08-15'
        retirementDate: TBD
        replacedBy: CompletePayment
        guideUrl: https://developer.squareup.com/docs/payments-api/migrate-from-transactions-api
      security:
      - oauth2:
        - PAYMENTS_WRITE
      parameters:
      - name: location_id
        description: ''
        schema:
          type: string
        in: path
        required: true
      - name: transaction_id
        description: ''
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureTransactionResponse'
      x-endpoint-errors:
      - error-code: DELAYED_TRANSACTION_CANCELED
      - error-code: DELAYED_TRANSACTION_EXPIRED
  /v2/locations/{location_id}/transactions/{transaction_id}/void:
    post:
      tags:
      - Transactions
      summary: Square Void Transaction
      operationId: VoidTransaction
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Cancels a transaction that was created with the [Charge](api-endpoint:Transactions-Charge)

        endpoint with a `delay_capture` value of `true`.



        See [Delayed capture transactions](https://developer.squareup.com/docs/payments/transactions/overview#delayed-capture)

        for more information.'
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2019-08-15'
        retirementDate: TBD
        replacedBy: CancelPayment
        guideUrl: https://developer.squareup.com/docs/payments-api/migrate-from-transactions-api
      security:
      - oauth2:
        - PAYMENTS_WRITE
      parameters:
      - name: location_id
        description: ''
        schema:
          type: string
        in: path
        required: true
      - name: transaction_id
        description: ''
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidTransactionResponse'
      x-endpoint-errors:
      - error-code: DELAYED_TRANSACTION_CAPTURED
      - error-code: DELAYED_TRANSACTION_EXPIRED
components:
  schemas:
    TenderCardDetails:
      type: object
      description: Represents additional details of a tender with `type` `CARD` or `SQUARE_GIFT_CARD`
      x-release-status: PUBLIC
      properties:
        status:
          $ref: '#/components/schemas/TenderCardDetailsStatus'
          description: 'The credit card payment''s current state (such as `AUTHORIZED` or

            `CAPTURED`). See [TenderCardDetailsStatus](entity:TenderCardDetailsStatus)

            for possible values.

            See [TenderCardDetailsStatus](#type-tendercarddetailsstatus) for possible values'
          nullable: true
        card:
          $ref: '#/components/schemas/Card'
          description: The credit card's non-confidential details.
          nullable: true
        entry_method:
          $ref: '#/components/schemas/TenderCardDetailsEntryMethod'
          description: 'The method used to enter the card''s details for the transaction.

            See [TenderCardDetailsEntryMethod](#type-tendercarddetailsentrymethod) for possible values'
          nullable: true
    Address:
      type: object
      description: "Represents a postal address in a country. \nFor more information, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses)."
      x-release-status: PUBLIC
      properties:
        address_line_1:
          type: string
          description: 'The first line of the address.


            Fields that start with `address_line` provide the address''s most specific

            details, like street number, street name, and building name. They do *not*

            provide less specific details like city, state/province, or country (these

            details are provided in other fields).'
          nullable: true
        address_line_2:
          type: string
          description: The second line of the address, if any.
          nullable: true
        address_line_3:
          type: string
          description: The third line of the address, if any.
          nullable: true
        locality:
          type: string
          description: The city or town of the address. For a full list of field meanings by country, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses).
          nullable: true
        sublocality:
          type: string
          description: A civil region within the address's `locality`, if any.
          nullable: true
        sublocality_2:
          type: string
          description: A civil region within the address's `sublocality`, if any.
          nullable: true
        sublocality_3:
          type: string
          description: A civil region within the address's `sublocality_2`, if any.
          nullable: true
        administrative_district_level_1:
          type: string
          description: 'A civil entity within the address''s country. In the US, this

            is the state. For a full list of field meanings by country, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses).'
          nullable: true
        administrative_district_level_2:
          type: string
          description: 'A civil entity within the address''s `administrative_district_level_1`.

            In the US, this is the county.'
          nullable: true
        administrative_district_level_3:
          type: string
          description: 'A civil entity within the address''s `administrative_district_level_2`,

            if any.'
          nullable: true
        postal_code:
          type: string
          description: The address's postal code. For a full list of field meanings by country, see [Working with Addresses](https://developer.squareup.com/docs/build-basics/working-with-addresses).
          nullable: true
        country:
          $ref: '#/components/schemas/Country'
          description: 'The address''s country, in the two-letter format of ISO 3166. For example, `US` or `FR`.

            See [Country](#type-country) for possible values'
          nullable: true
        first_name:
          type: string
          description: Optional first name when it's representing recipient.
          nullable: true
        last_name:
          type: string
          description: Optional last name when it's representing recipient.
          nullable: true
    ListTransactionsResponse:
      type: object
      description: 'Defines the fields that are included in the response body of

        a request to the [ListTransactions](api-endpoint:Transactions-ListTransactions) endpoint.


        One of `errors` or `transactions` is present in a given response (never both).'
      x-release-status: DEPRECATED
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: Any errors that occurred during the request.
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
          description: An array of transactions that match your query.
        cursor:
          type: string
          description: 'A pagination cursor for retrieving the next set of results,

            if any remain. Provide this value as the `cursor` parameter in a subsequent

            request to this endpoint.


            See [Paginating results](https://developer.squareup.com/docs/working-with-apis/pagination) for more information.'
      example:
        transactions:
        - created_at: '2016-01-20T22:57:56Z'
          id: KnL67ZIwXCPtzOrqj0HrkxMF
          location_id: 18YC4JDH91E1H
          product: EXTERNAL_API
          reference_id: some optional reference id
          refunds:
          - additional_recipients:
            - amount_money:
                amount: 100
                currency: USD
              description: Application fees
              location_id: 057P5VYJ4A5X1
            amount_money:
              amount: 5000
              currency: USD
            created_at: '2016-01-20T22:59:20Z'
            id: 7a5RcVI0CxbOcJ2wMOkE
            location_id: 18YC4JDH91E1H
            processing_fee_money:
              amount: 138
              currency: USD
            reason: some reason why
            status: APPROVED
            tender_id: MtZRYYdDrYNQbOvV7nbuBvMF
            transaction_id: KnL67ZIwXCPtzOrqj0HrkxMF
          tenders:
          - additional_recipients:
            - amount_money:
                amount: 20
                currency: USD
              description: Application fees
              location_id: 057P5VYJ4A5X1
            amount_money:
              amount: 5000
              currency: USD
            card_details:
              card:
                card_brand: VISA
                last_4: '1111'
              entry_method: KEYED
              status: CAPTURED
            created_at: '2016-01-20T22:57:56Z'
            id: MtZRYYdDrYNQbOvV7nbuBvMF
            location_id: 18YC4JDH91E1H
            note: some optional note
            processing_fee_money:
              amount: 138
              currency: USD
            transaction_id: KnL67ZIwXCPtzOrqj0HrkxMF
            type: CARD
      x-sq-sdk-sample-code:
        csharp: /sdk_samples/ListTransactions/ListTransactionsResponse.csharp
        java: /sdk_samples/ListTransactions/ListTransactionsResponse.java
        javascript: /sdk_samples/ListTransactions/ListTransactionsResponse.javascript
        php: /sdk_samples/ListTransactions/ListTransactionsResponse.php
        python: /sdk_samples/ListTransactions/ListTransactionsResponse.python
        ruby: /sdk_samples/ListTransactions/ListTransactionsResponse.ruby
