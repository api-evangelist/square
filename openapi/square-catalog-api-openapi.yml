    CatalogPricingRule:
      type: object
      description: 'Defines how discounts are automatically applied to a set of items that match the pricing rule

        during the active time period.'
      x-release-status: PUBLIC
      properties:
        name:
          type: string
          description: 'User-defined name for the pricing rule. For example, "Buy one get one

            free" or "10% off".'
          nullable: true
        time_period_ids:
          type: array
          items:
            type: string
          description: 'A list of unique IDs for the catalog time periods when

            this pricing rule is in effect. If left unset, the pricing rule is always

            in effect.'
          nullable: true
        discount_id:
          type: string
          description: 'Unique ID for the `CatalogDiscount` to take off

            the price of all matched items.'
          nullable: true
        match_products_id:
          type: string
          description: 'Unique ID for the `CatalogProductSet` that will be matched by this rule. A match rule

            matches within the entire cart, and can match multiple times. This field will always be set.'
          nullable: true
        apply_products_id:
          type: string
          description: '__Deprecated__: Please use the `exclude_products_id` field to apply

            an exclude set instead. Exclude sets allow better control over quantity

            ranges and offer more flexibility for which matched items receive a discount.


            `CatalogProductSet` to apply the pricing to.

            An apply rule matches within the subset of the cart that fits the match rules (the match set).

            An apply rule can only match once in the match set.

            If not supplied, the pricing will be applied to all products in the match set.

            Other products retain their base price, or a price generated by other rules.'
          x-release-status: DEPRECATED
          nullable: true
        exclude_products_id:
          type: string
          description: '`CatalogProductSet` to exclude from the pricing rule.

            An exclude rule matches within the subset of the cart that fits the match rules (the match set).

            An exclude rule can only match once in the match set.

            If not supplied, the pricing will be applied to all products in the match set.

            Other products retain their base price, or a price generated by other rules.'
          nullable: true
        valid_from_date:
          type: string
          description: Represents the date the Pricing Rule is valid from. Represented in RFC 3339 full-date format (YYYY-MM-DD).
          nullable: true
        valid_from_local_time:
          type: string
          description: 'Represents the local time the pricing rule should be valid from. Represented in RFC 3339 partial-time format

            (HH:MM:SS). Partial seconds will be truncated.'
          nullable: true
        valid_until_date:
          type: string
          description: Represents the date the Pricing Rule is valid until. Represented in RFC 3339 full-date format (YYYY-MM-DD).
          nullable: true
        valid_until_local_time:
          type: string
          description: 'Represents the local time the pricing rule should be valid until. Represented in RFC 3339 partial-time format

            (HH:MM:SS). Partial seconds will be truncated.'
          nullable: true
        exclude_strategy:
          $ref: '#/components/schemas/ExcludeStrategy'
          description: 'If an `exclude_products_id` was given, controls which subset of matched

            products is excluded from any discounts.


            Default value: `LEAST_EXPENSIVE`

            See [ExcludeStrategy](#type-excludestrategy) for possible values'
          nullable: true
        minimum_order_subtotal_money:
          $ref: '#/components/schemas/Money'
          description: 'The minimum order subtotal (before discounts or taxes are applied)

            that must be met before this rule may be applied.'
          nullable: true
        customer_group_ids_any:
          type: array
          items:
            type: string
          description: 'A list of IDs of customer groups, the members of which are eligible for discounts specified in this pricing rule.

            Notice that a group ID is generated by the Customers API.

            If this field is not set, the specified discount applies to matched products sold to anyone whether the buyer

            has a customer profile created or not. If this `customer_group_ids_any` field is set, the specified discount

            applies only to matched products sold to customers belonging to the specified customer groups.'
          nullable: true
