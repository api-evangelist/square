          The quick-amounts-settings-specific data must be set on the `quick_amounts_settings_data` field.'
      - name: SUBSCRIPTION_PLAN
        description: 'The `CatalogObject` instance is of the [CatalogSubscriptionPlan](entity:CatalogSubscriptionPlan) type and represents a subscription plan.

          The subscription plan specific data must be stored on the `subscription_plan_data` field.'
      - name: AVAILABILITY_PERIOD
        description: 'The `CatalogObject` instance is of the [CatalogAvailabilityPeriod](entity:CatalogAvailabilityPeriod) type and represents an availability period.

          The availability period specific data must be stored on the `availability_period_data` field.'
