        version:
          type: integer
          description: 'The version of the object. When updating an object, the version supplied

            must match the version in the database, otherwise the write will be rejected as conflicting.'
          format: int64
        is_deleted:
          type: boolean
          description: 'If `true`, the object has been deleted from the database. Must be `false` for new objects

            being inserted. When deleted, the `updated_at` field will equal the deletion time.'
          nullable: true
