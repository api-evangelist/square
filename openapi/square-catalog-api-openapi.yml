      required:
      - type
      - id
      properties:
        type:
          $ref: '#/components/schemas/CatalogObjectType'
          description: 'The type of this object. Each object type has expected

            properties expressed in a structured format within its corresponding `*_data` field below.

            See [CatalogObjectType](#type-catalogobjecttype) for possible values'
        id:
          type: string
          description: 'An identifier to reference this object in the catalog. When a new `CatalogObject`

            is inserted, the client should set the id to a temporary identifier starting with

            a "`#`" character. Other objects being inserted or updated within the same request

            may use this identifier to refer to the new object.


            When the server receives the new object, it will supply a unique identifier that

            replaces the temporary identifier for all future references.'
          minLength: 1
        updated_at:
          type: string
          description: 'Last modification [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates) in RFC 3339 format, e.g., `"2016-08-15T23:59:33.123Z"`

