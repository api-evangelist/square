    DeleteShiftResponse:
      type: object
      description: "The response to a request to delete a `Shift`. The response might contain a set of \n`Error` objects if the request resulted in errors."
      x-release-status: PUBLIC
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: Any errors that occurred during the request.
      example: {}
    Money:
      type: object
      description: 'Represents an amount of money. `Money` fields can be signed or unsigned.

        Fields that do not explicitly define whether they are signed or unsigned are

        considered unsigned and can only hold positive amounts. For signed fields, the

        sign of the value indicates the purpose of the money transfer. See

        [Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts)

        for more information.'
      x-release-status: PUBLIC
      properties:
        amount:
          type: integer
          description: 'The amount of money, in the smallest denomination of the currency

            indicated by `currency`. For example, when `currency` is `USD`, `amount` is

            in cents. Monetary amounts can be positive or negative. See the specific

            field description to determine the meaning of the sign in a particular case.'
          format: int64
          nullable: true
        currency:
          $ref: '#/components/schemas/Currency'
          description: 'The type of currency, in __ISO 4217 format__. For example, the currency

            code for US dollars is `USD`.


            See [Currency](entity:Currency) for possible values.

            See [Currency](#type-currency) for possible values'
          nullable: true
    Shift:
      type: object
      description: 'A record of the hourly rate, start, and end times for a single work shift

        for an employee. This might include a record of the start and end times for breaks

        taken during the shift.'
      x-release-status: PUBLIC
      required:
      - location_id
      - start_at
      properties:
        id:
          type: string
          description: The UUID for this object.
          maxLength: 255
        employee_id:
          type: string
          description: The ID of the employee this shift belongs to. DEPRECATED at version 2020-08-26. Use `team_member_id` instead.
          x-release-status: DEPRECATED
          nullable: true
        location_id:
          type: string
          description: 'The ID of the location this shift occurred at. The location should be based on

            where the employee clocked in.'
          minLength: 1
        timezone:
          type: string
          description: 'The read-only convenience value that is calculated from the location based

            on the `location_id`. Format: the IANA timezone database identifier for the

            location timezone.'
          nullable: true
        start_at:
          type: string
          description: 'RFC 3339; shifted to the location timezone + offset. Precision up to the

            minute is respected; seconds are truncated.'
          minLength: 1
        end_at:
          type: string
          description: 'RFC 3339; shifted to the timezone + offset. Precision up to the minute is

            respected; seconds are truncated.'
          nullable: true
        wage:
          $ref: '#/components/schemas/ShiftWage'
          description: 'Job and pay related information. If the wage is not set on create, it defaults to a wage

            of zero. If the title is not set on create, it defaults to the name of the role the employee

            is assigned to, if any.'
          nullable: true
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/Break'
          description: A list of all the paid or unpaid breaks that were taken during this shift.
          nullable: true
        status:
          $ref: '#/components/schemas/ShiftStatus'
          description: 'Describes the working state of the current `Shift`.

            See [ShiftStatus](#type-shiftstatus) for possible values'
          nullable: true
        version:
          type: integer
          description: 'Used for resolving concurrency issues. The request fails if the version

            provided does not match the server version at the time of the request. If not provided,

            Square executes a blind write; potentially overwriting data from another

            write.'
        created_at:
          type: string
          description: A read-only timestamp in RFC 3339 format; presented in UTC.
          readOnly: true
        updated_at:
          type: string
          description: A read-only timestamp in RFC 3339 format; presented in UTC.
          readOnly: true
        team_member_id:
          type: string
          description: The ID of the team member this shift belongs to. Replaced `employee_id` at version "2020-08-26".
          nullable: true
        declared_cash_tip_money:
          $ref: '#/components/schemas/Money'
          description: The tips declared by the team member for the shift.
          nullable: true
