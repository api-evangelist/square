    Money:
      type: object
      description: 'Represents an amount of money. `Money` fields can be signed or unsigned.

        Fields that do not explicitly define whether they are signed or unsigned are

        considered unsigned and can only hold positive amounts. For signed fields, the

        sign of the value indicates the purpose of the money transfer. See

        [Working with Monetary Amounts](https://developer.squareup.com/docs/build-basics/working-with-monetary-amounts)

        for more information.'
      x-release-status: PUBLIC
      properties:
        amount:
          type: integer
          description: 'The amount of money, in the smallest denomination of the currency

            indicated by `currency`. For example, when `currency` is `USD`, `amount` is

            in cents. Monetary amounts can be positive or negative. See the specific

            field description to determine the meaning of the sign in a particular case.'
          format: int64
          nullable: true
        currency:
          $ref: '#/components/schemas/Currency'
          description: 'The type of currency, in __ISO 4217 format__. For example, the currency

            code for US dollars is `USD`.


            See [Currency](entity:Currency) for possible values.

            See [Currency](#type-currency) for possible values'
          nullable: true
    WageSetting:
      type: object
      description: 'Represents information about the overtime exemption status, job assignments, and compensation

        for a [team member](entity:TeamMember).'
      x-release-status: PUBLIC
      properties:
        team_member_id:
          type: string
          description: The ID of the team member associated with the wage setting.
          nullable: true
        job_assignments:
          type: array
          items:
            $ref: '#/components/schemas/JobAssignment'
          description: '**Required** The ordered list of jobs that the team member is assigned to.

            The first job assignment is considered the team member''s primary job.'
          nullable: true
        is_overtime_exempt:
          type: boolean
          description: Whether the team member is exempt from the overtime rules of the seller's country.
          nullable: true
        version:
          type: integer
          description: '**Read only** Used for resolving concurrency issues. The request fails if the version

            provided does not match the server version at the time of the request. If not provided,

            Square executes a blind write, potentially overwriting data from another write. For more information,

            see [optimistic concurrency](https://developer.squareup.com/docs/working-with-apis/optimistic-concurrency).'
        created_at:
          type: string
          description: The timestamp when the wage setting was created, in RFC 3339 format.
          readOnly: true
        updated_at:
          type: string
          description: The timestamp when the wage setting was last updated, in RFC 3339 format.
          readOnly: true
