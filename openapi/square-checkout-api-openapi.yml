    CatalogCustomAttributeDefinition:
      type: object
      description: 'Contains information defining a custom attribute. Custom attributes are

        intended to store additional information about a catalog object or to associate a

        catalog object with an entity in another system. Do not use custom attributes

        to store any sensitive information (personally identifiable information, card details, etc.).

        [Read more about custom attributes](https://developer.squareup.com/docs/catalog-api/add-custom-attributes)'
      x-release-status: PUBLIC
      required:
      - type
      - name
      - allowed_object_types
      properties:
        type:
          $ref: '#/components/schemas/CatalogCustomAttributeDefinitionType'
          description: 'The type of this custom attribute. Cannot be modified after creation.

            Required.

            See [CatalogCustomAttributeDefinitionType](#type-catalogcustomattributedefinitiontype) for possible values'
        name:
          type: string
          description: ' The name of this definition for API and seller-facing UI purposes.

            The name must be unique within the (merchant, application) pair. Required.

            May not be empty and may not exceed 255 characters. Can be modified after creation.'
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: 'Seller-oriented description of the meaning of this Custom Attribute,

            any constraints that the seller should observe, etc. May be displayed as a tooltip in Square UIs.'
          maxLength: 255
          nullable: true
        source_application:
          $ref: '#/components/schemas/SourceApplication'
          description: '__Read only.__ Contains information about the application that

            created this custom attribute definition.'
          nullable: true
        allowed_object_types:
          type: array
          items:
            $ref: '#/components/schemas/CatalogObjectType'
          description: 'The set of `CatalogObject` types that this custom atttribute may be applied to.

            Currently, only `ITEM`, `ITEM_VARIATION`, `MODIFIER`, `MODIFIER_LIST`, and `CATEGORY` are allowed. At least one type must be included.

            See [CatalogObjectType](#type-catalogobjecttype) for possible values'
        seller_visibility:
          $ref: '#/components/schemas/CatalogCustomAttributeDefinitionSellerVisibility'
          description: 'The visibility of a custom attribute in seller-facing UIs (including Square Point

            of Sale applications and Square Dashboard). May be modified.

            See [CatalogCustomAttributeDefinitionSellerVisibility](#type-catalogcustomattributedefinitionsellervisibility) for possible values'
          nullable: true
        app_visibility:
          $ref: '#/components/schemas/CatalogCustomAttributeDefinitionAppVisibility'
          description: 'The visibility of a custom attribute to applications other than the application

            that created the attribute.

            See [CatalogCustomAttributeDefinitionAppVisibility](#type-catalogcustomattributedefinitionappvisibility) for possible values'
          nullable: true
        string_config:
          $ref: '#/components/schemas/CatalogCustomAttributeDefinitionStringConfig'
          description: Optionally, populated when `type` = `STRING`, unset otherwise.
          nullable: true
        number_config:
          $ref: '#/components/schemas/CatalogCustomAttributeDefinitionNumberConfig'
          description: Optionally, populated when `type` = `NUMBER`, unset otherwise.
          nullable: true
        selection_config:
          $ref: '#/components/schemas/CatalogCustomAttributeDefinitionSelectionConfig'
          description: Populated when `type` is set to `SELECTION`, unset otherwise.
          nullable: true
        custom_attribute_usage_count:
          type: integer
          description: 'The number of custom attributes that reference this

            custom attribute definition. Set by the server in response to a ListCatalog

            request with `include_counts` set to `true`.  If the actual count is greater

            than 100, `custom_attribute_usage_count` will be set to `100`.'
          readOnly: true
        key:
          type: string
          description: 'The name of the desired custom attribute key that can be used to access

            the custom attribute value on catalog objects. Cannot be modified after the

            custom attribute definition has been created.

            Must be between 1 and 60 characters, and may only contain the characters `[a-zA-Z0-9_-]`.'
          minLength: 1
          maxLength: 60
          pattern: ^[a-zA-Z0-9_-]*$
          nullable: true
