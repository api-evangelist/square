            $ref: '#/components/schemas/OrderLineItemPricingBlocklistsBlockedTax'
          description: 'A list of taxes blocked from applying to the line item.

            Taxes can be blocked by the `tax_uid` (for ad hoc taxes) or

            the `tax_catalog_object_id` (for catalog taxes).'
          nullable: true
    PaymentLink:
      type: object
      x-release-status: PUBLIC
      required:
      - version
      properties:
        id:
          type: string
          description: The Square-assigned ID of the payment link.
          readOnly: true
        version:
          type: integer
          description: The Square-assigned version number, which is incremented each time an update is committed to the payment link.
          maximum: 65535
        description:
          type: string
          description: 'The optional description of the `payment_link` object.

            It is primarily for use by your application and is not used anywhere.'
          maxLength: 4096
          nullable: true
        order_id:
          type: string
          description: The ID of the order associated with the payment link.
          maxLength: 192
          readOnly: true
        checkout_options:
          $ref: '#/components/schemas/CheckoutOptions'
          description: 'The checkout options configured for the payment link.

            For more information, see [Optional Checkout Configurations](https://developer.squareup.com/docs/checkout-api/optional-checkout-configurations).'
          nullable: true
        pre_populated_data:
          $ref: '#/components/schemas/PrePopulatedData'
          description: 'Describes buyer data to prepopulate

            on the checkout page.'
          nullable: true
        url:
          type: string
          description: The shortened URL of the payment link.
          maxLength: 255
          readOnly: true
        long_url:
          type: string
          description: The long URL of the payment link.
          maxLength: 255
          readOnly: true
        created_at:
          type: string
          description: The timestamp when the payment link was created, in RFC 3339 format.
        updated_at:
          type: string
          description: The timestamp when the payment link was last updated, in RFC 3339 format.
        payment_note:
          type: string
          description: 'An optional note. After Square processes the payment, this note is added to the

            resulting `Payment`.'
          maxLength: 500
          nullable: true
    ListPaymentLinksResponse:
      type: object
      x-release-status: PUBLIC
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: Errors that occurred during the request.
        payment_links:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLink'
          description: The list of payment links.
        cursor:
          type: string
          description: '  When a response is truncated, it includes a cursor that you can use in a subsequent request

            to retrieve the next set of gift cards. If a cursor is not present, this is the final response.

            For more information, see [Pagination](https://developer.squareup.com/docs/build-basics/common-api-patterns/pagination).'
      example:
        cursor: MTY1NQ==
        payment_links:
        - checkout_options:
            ask_for_shipping_address: true
          created_at: '2022-04-26T00:15:15Z'
          id: TN4BWEDJ9AI5MBIV
          order_id: Qqc6yppGvxVwc46Cch4zHTaJqc4F
          payment_note: test
          updated_at: '2022-04-26T00:18:24Z'
          url: https://square.link/u/EXAMPLE
          version: 2
        - created_at: '2022-04-11T23:14:59Z'
          description: ''
          id: RY5UNCUMPJN5XKCT
          order_id: EmBmGt3zJD15QeO1dxzBTxMxtwfZY
          url: https://square.link/u/EXAMPLE
          version: 1
    OrderLineItemAppliedDiscount:
      type: object
      description: 'Represents an applied portion of a discount to a line item in an order.


        Order scoped discounts have automatically applied discounts present for each line item.

        Line-item scoped discounts must have applied discounts added manually for any applicable line

        items. The corresponding applied money is automatically computed based on participating

        line items.'
      x-release-status: BETA
      required:
      - discount_uid
      properties:
        uid:
          type: string
          description: A unique ID that identifies the applied discount only within this order.
          maxLength: 60
          nullable: true
        discount_uid:
          type: string
          description: 'The `uid` of the discount that the applied discount represents. It must

            reference a discount present in the `order.discounts` field.


            This field is immutable. To change which discounts apply to a line item,

            you must delete the discount and re-add it as a new `OrderLineItemAppliedDiscount`.'
          minLength: 1
          maxLength: 60
        applied_money:
          $ref: '#/components/schemas/Money'
          description: The amount of money applied by the discount to the line item.
          readOnly: true
    FulfillmentShipmentDetails:
      type: object
      description: Contains the details necessary to fulfill a shipment order.
      x-release-status: BETA
      properties:
        recipient:
          $ref: '#/components/schemas/FulfillmentRecipient'
          description: Information about the person to receive this shipment fulfillment.
          nullable: true
        carrier:
          type: string
          description: The shipping carrier being used to ship this fulfillment (such as UPS, FedEx, or USPS).
          maxLength: 50
          nullable: true
        shipping_note:
          type: string
          description: A note with additional information for the shipping carrier.
          maxLength: 500
          nullable: true
        shipping_type:
          type: string
          description: 'A description of the type of shipping product purchased from the carrier

            (such as First Class, Priority, or Express).'
          maxLength: 50
          nullable: true
        tracking_number:
          type: string
          description: The reference number provided by the carrier to track the shipment's progress.
          maxLength: 100
          nullable: true
        tracking_url:
          type: string
          description: A link to the tracking webpage on the carrier's website.
          maxLength: 2000
          nullable: true
        placed_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the shipment was requested. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        in_progress_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when this fulfillment was moved to the `RESERVED` state, which  indicates that preparation

            of this shipment has begun. The timestamp must be in RFC 3339 format (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        packaged_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when this fulfillment was moved to the `PREPARED` state, which indicates that the

            fulfillment is packaged. The timestamp must be in RFC 3339 format (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        expected_shipped_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the shipment is expected to be delivered to the shipping carrier.

            The timestamp must be in RFC 3339 format (for example, "2016-09-04T23:59:33.123Z").'
          nullable: true
        shipped_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when this fulfillment was moved to the `COMPLETED` state, which indicates that

            the fulfillment has been given to the shipping carrier. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        canceled_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating the shipment was canceled.

            The timestamp must be in RFC 3339 format (for example, "2016-09-04T23:59:33.123Z").'
          nullable: true
        cancel_reason:
          type: string
          description: A description of why the shipment was canceled.
          maxLength: 100
          nullable: true
        failed_at:
          type: string
          description: 'The [timestamp](https://developer.squareup.com/docs/build-basics/working-with-dates)

            indicating when the shipment failed to be completed. The timestamp must be in RFC 3339 format

            (for example, "2016-09-04T23:59:33.123Z").'
          readOnly: true
        failure_reason:
          type: string
          description: A description of why the shipment failed to be completed.
          maxLength: 100
          nullable: true
  securitySchemes:
    oauth2:
      type: oauth2
      x-additional-headers:
      - name: Square-Version
        description: Square Connect API versions
        schema:
          default: '2025-01-23'
      flows:
        authorizationCode:
          authorizationUrl: https://connect.squareup.com/oauth2/authorize
          tokenUrl: https://connect.squareup.com/oauth2/token
          scopes:
            ADDON_CONFIGURATIONS_READ: '__HTTP Method__: `GET`


              Grants write access for third-party Add-ons to read configurations of their Add-ons, for example, when calling `RetrieveConfiguration` endpoint.'
            ADDON_CONFIGURATIONS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access for third-party Add-ons to store configurations of their Add-ons, for example, when calling `CreateConfiguration` endpoint.'
            APPOINTMENTS_ALL_READ: '__HTTP Method__: `GET`, `POST`


              Grants read access to all of a seller''s booking information, calendar, and business details.

              This permission must be accompanied by the `APPOINTMENTS_READ` permission.'
            APPOINTMENTS_ALL_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to all booking details, including double-booking a seller.

              This permission must be accompanied by the `APPOINTMENTS_WRITE` permission.'
            APPOINTMENTS_BUSINESS_SETTINGS_READ: '__HTTP Method__: `GET`


              Grants read access to booking business settings. For example, to call the

              ListTeamMemberBookingProfiles endpoint.'
            APPOINTMENTS_READ: '__HTTP Method__: `GET`, `POST`


              Grants read access to booking information. For example, to call the

              RetrieveBooking endpoint.'
            APPOINTMENTS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to booking information. For example, to call the CreateBooking endpoint.'
            BANK_ACCOUNTS_READ: '__HTTP Method__: `GET`


              Grants read access to bank account information associated with the targeted

              Square account. For example, to call the Connect v1 ListBankAccounts endpoint.'
            CASH_DRAWER_READ: '__HTTP Method__: `GET`


              Grants read access to cash drawer shift information. For example, to call the

              ListCashDrawerShifts endpoint.'
            CHANNELS_CREATE: '__HTTP Method__: `POST`


              Grants write access to create channels, for example, when calling the

              `CreateChannel` endpoint.'
            CHANNELS_READ: '__HTTP Method__: `GET`


              Grants read access to view channels, for example, when calling the

              `RetrieveChannel` endpoint.'
            CHANNELS_UPDATE: '__HTTP Method__: `PUT`


              Grants write access to update channels, for example, when calling the

              `UpdateChannel` endpoint.'
            CUSTOMERS_READ: '__HTTP Method__: `GET`


              Grants read access to customer information. For example, to call the

              ListCustomers endpoint.'
            CUSTOMERS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to customer information. For example, to create and update

              customer profiles.'
            DEVICES_READ: '__HTTP Method__: `GET`


              Grants read access to device information. For example, to

              call the `GetDevice` and `ListDevices` endpoints.'
            DEVICE_CREDENTIAL_MANAGEMENT: '__HTTP Method__: `POST`, `GET`


              Grants read/write access to device credentials information. For example, to

              call the CreateDeviceCode endpoint.'
            DISPUTES_READ: '__HTTP Method__: `GET`


              Grants read access to dispute information. For example, to call the RetrieveDispute

              endpoint.'
            DISPUTES_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to dispute information. For example, to call the SubmitEvidence

              endpoint.'
            EMPLOYEES_READ: '__HTTP Method__: `GET`


              Grants read access to employee profile information. For example, to call the

              Connect v1 Employees API.'
            EMPLOYEES_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to employee profile information. For example, to create

              and modify employee profiles.'
            GIFTCARDS_READ: '__HTTP Method__: `GET`, `POST`


              Grants read access to gift card information. For example, to call the RetrieveGiftCard

              endpoint.'
            GIFTCARDS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to gift card information. For example, to call the CreateGiftCard

              endpoint.'
            INVENTORY_READ: '__HTTP Method__: `GET`


              Grants read access to inventory information. For example, to call the

              RetrieveInventoryCount endpoint.'
            INVENTORY_WRITE: '__HTTP Method__:  `POST`, `PUT`, `DELETE`


              Grants write access to inventory information. For example, to call the

              BatchChangeInventory endpoint.'
            INVOICES_READ: '__HTTP Method__: `GET`, `POST`


              Grants read access to invoice information. For example, to call the ListInvoices endpoint.'
            INVOICES_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to invoice information. For example, to call the CreateInvoice endpoint.'
            ITEMS_READ: '__HTTP Method__: `GET`


              Grants read access to product catalog information. For example, to obtain objects in a product catalog.'
            ITEMS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to product catalog information. For example, to modify or

              add to a product catalog.'
            LOYALTY_READ: '__HTTP Method__: `GET`


              Grants read access to loyalty information. For example, to call the

              ListLoyaltyPrograms endpoint.'
            LOYALTY_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to loyalty information. For example, to call the

              CreateLoyaltyAccount endpoint.'
            MERCHANT_PROFILE_READ: '__HTTP Method__: `GET`


              Grants read access to business and location information. For example, to

              obtain a location ID for subsequent activity.'
            MERCHANT_PROFILE_WRITE: '__HTTP Method__: `POST`, `PUT`


              Grants write access to business and location information. For example, to create a new location or

              update the business hours at an existing location.'
            ONLINE_STORE_SITE_READ: '__HTTP Method__: `GET`, `POST`


              Read access to ECOM online store site details.'
            ONLINE_STORE_SNIPPETS_READ: '__HTTP Method__: `GET`, `POST`


              Read access to ECOM online store snippets on published websites.'
            ONLINE_STORE_SNIPPETS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Write access to ECOM online store snippets on published websites.'
            ORDERS_READ: '__HTTP Method__: `GET`


              Grants read access to order information. For example, to call the

              BatchRetrieveOrders endpoint.'
            ORDERS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to order information. For example, to call the

              CreateCheckout endpoint.'
            PAYMENTS_READ: '__HTTP Method__: `GET`


              Grants read access to transaction and refund information. For example, to call

              the RetrieveTransaction endpoint.'
            PAYMENTS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to transaction and refunds information. For example, to

              process payments with the Payments or Checkout API.'
            PAYMENTS_WRITE_ADDITIONAL_RECIPIENTS: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Allow third party applications to deduct a portion of each transaction amount.

              __Required__ to use multiparty transaction functionality with the Payments

              API.'
            PAYMENTS_WRITE_IN_PERSON: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to payments and refunds information. For example, to

              process in-person payments.'
            PAYMENTS_WRITE_SHARED_ONFILE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Allows the developer to process payments on behalf of a seller using a shared on file payment method.'
            PAYOUTS_READ: '__HTTP Method__: `GET`


              Grants read access to payouts and payout entries information. For example,

              to call the Connect v2 `ListPayouts` endpoint.'
            PERMISSION_SETS_READ: '__HTTP Method__: `GET`


              Grants read access to Permission Sets. For example, to

              call the `ListPermissionSets` and `RetrievePermissionSet` endpoints.'
            PERMISSION_SETS_WRITE: '__HTTP Method__: `PUT`


              Grants write access to Permission Sets.'
            RESERVATIONS_READ: '__HTTP Method__: `GET`


              Grants read access to reservation information, for example, when calling the

              `RetrieveReservation` endpoint.'
            RESERVATIONS_WRITE: '__HTTP Method__:  `POST`, `PUT`, `DELETE`


              Grants write access to reservation information, for example, when calling the

              `CreateReservation` endpoint.'
            RESTAURANT_CHECKS_READ: '__HTTP Method__: `GET`


              Grants read access to check information, for example, when calling the

              `RetrieveCheck` endpoint.'
            SETTLEMENTS_READ: '__HTTP Method__: `GET`


              Grants read access to settlement (deposit) information. For example, to call

              the Connect v1 ListSettlements endpoint.'
            SUBSCRIPTIONS_READ: '__HTTP Method__: `GET`, `POST`


              Grants read access to subscription information. For example, to call the RetrieveSubscription

              endpoint.'
            SUBSCRIPTIONS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to subscription information. For example, to call the CreateSubscription

              endpoint.'
            TIMECARDS_READ: '__HTTP Method__: `GET`


              Grants read access to employee timecard information. For example, to call the

              Connect v2 SearchShifts endpoint.'
            TIMECARDS_SETTINGS_READ: '__HTTP Method__: `GET`


              Grants read access to employee timecard settings information. For example, to

              call the GetBreakType endpoint.'
            TIMECARDS_SETTINGS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to employee timecard settings information. For example, to

              call the UpdateBreakType endpoint.'
            TIMECARDS_WRITE: '__HTTP Method__: `POST`, `PUT`, `DELETE`


              Grants write access to employee shift information. For example, to create

              and modify employee shifts.'
            VENDOR_READ: '__HTTP Method__: `GET`, `POST`


              Grants read access to vendor information, for example, when calling the

              `RetrieveVendor` endpoint.'
            VENDOR_WRITE: '__HTTP Method__:  `POST`, `PUT`, `DELETE`


              Grants write access to vendor information, for example, when calling the

              `BulkUpdateVendors` endpoint.'
    oauth2ClientSecret:
      type: apiKey
      in: header
      name: Authorization
x-fern-global-headers:
- header: Square-Version
  name: version
  optional: true
  env: VERSION
  type: literal<"2025-01-23">
