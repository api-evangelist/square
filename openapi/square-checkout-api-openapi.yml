    OrderLineItemDiscount:
      type: object
      description: 'Represents a discount that applies to one or more line items in an

        order.


        Fixed-amount, order-scoped discounts are distributed across all non-zero line item totals.

        The amount distributed to each line item is relative to the

        amount contributed by the item to the order subtotal.'
      x-release-status: PUBLIC
      properties:
        uid:
          type: string
          description: A unique ID that identifies the discount only within this order.
          maxLength: 60
          x-release-status: BETA
          nullable: true
        catalog_object_id:
          type: string
          description: The catalog object ID referencing [CatalogDiscount](entity:CatalogDiscount).
          maxLength: 192
          nullable: true
        catalog_version:
          type: integer
          description: The version of the catalog object that this discount references.
          format: int64
          nullable: true
        name:
          type: string
          description: The discount's name.
          maxLength: 255
          nullable: true
        type:
          $ref: '#/components/schemas/OrderLineItemDiscountType'
          description: 'The type of the discount.


            Discounts that do not reference a catalog object ID must have a type of

            `FIXED_PERCENTAGE` or `FIXED_AMOUNT`.

            See [OrderLineItemDiscountType](#type-orderlineitemdiscounttype) for possible values'
          nullable: true
        percentage:
          type: string
          description: 'The percentage of the discount, as a string representation of a decimal number.

            A value of `7.25` corresponds to a percentage of 7.25%.


            `percentage` is not set for amount-based discounts.'
          maxLength: 10
          nullable: true
        amount_money:
          $ref: '#/components/schemas/Money'
          description: 'The total declared monetary amount of the discount.


            `amount_money` is not set for percentage-based discounts.'
          nullable: true
        applied_money:
          $ref: '#/components/schemas/Money'
          description: 'The amount of discount actually applied to the line item.


            The amount represents the amount of money applied as a line-item scoped discount.

            When an amount-based discount is scoped to the entire order, the value

            of `applied_money` is different than `amount_money` because the total

            amount of the discount is distributed across all line items.'
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Application-defined data attached to this discount. Metadata fields are intended

            to store descriptive references or associations with an entity in another system or store brief

            information about the object. Square does not process this field; it only stores and returns it

            in relevant API calls. Do not use metadata to store any sensitive information (such as personally

            identifiable information or card details).


            Keys written by applications must be 60 characters or less and must be in the character set

            `[a-zA-Z0-9_-]`. Entries can also include metadata generated by Square. These keys are prefixed

            with a namespace, separated from the key with a '':'' character.


            Values have a maximum length of 255 characters.


            An application can have up to 10 entries per metadata field.


            Entries written by applications are private and can only be read or modified by the same

            application.


            For more information, see [Metadata](https://developer.squareup.com/docs/build-basics/metadata).'
          x-release-status: BETA
          nullable: true
        scope:
          $ref: '#/components/schemas/OrderLineItemDiscountScope'
          description: 'Indicates the level at which the discount applies. For `ORDER` scoped discounts,

            Square generates references in `applied_discounts` on all order line items that do

            not have them. For `LINE_ITEM` scoped discounts, the discount only applies to line items

            with a discount reference in their `applied_discounts` field.


            This field is immutable. To change the scope of a discount, you must delete

            the discount and re-add it as a new discount.

            See [OrderLineItemDiscountScope](#type-orderlineitemdiscountscope) for possible values'
          nullable: true
        reward_ids:
          type: array
          items:
            type: string
          description: 'The reward IDs corresponding to this discount. The application and

            specification of discounts that have `reward_ids` are completely controlled by the backing

            criteria corresponding to the reward tiers of the rewards that are added to the order

            through the Loyalty API. To manually unapply discounts that are the result of added rewards,

            the rewards must be removed from the order through the Loyalty API.'
          readOnly: true
          x-release-status: BETA
        pricing_rule_id:
          type: string
          description: 'The object ID of a [pricing rule](entity:CatalogPricingRule) to be applied

            automatically to this discount. The specification and application of the discounts, to

            which a `pricing_rule_id` is assigned, are completely controlled by the corresponding

            pricing rule.'
          readOnly: true
    OrderReturn:
      type: object
      description: The set of line items, service charges, taxes, discounts, tips, and other items being returned in an order.
      x-release-status: BETA
      properties:
        uid:
          type: string
          description: A unique ID that identifies the return only within this order.
          maxLength: 60
          nullable: true
        source_order_id:
          type: string
          description: 'An order that contains the original sale of these return line items. This is unset

            for unlinked returns.'
          nullable: true
        return_line_items:
          type: array
          items:
            $ref: '#/components/schemas/OrderReturnLineItem'
          description: A collection of line items that are being returned.
          nullable: true
        return_service_charges:
          type: array
          items:
            $ref: '#/components/schemas/OrderReturnServiceCharge'
          description: A collection of service charges that are being returned.
          nullable: true
        return_taxes:
          type: array
          items:
            $ref: '#/components/schemas/OrderReturnTax'
          description: 'A collection of references to taxes being returned for an order, including the total

            applied tax amount to be returned. The taxes must reference a top-level tax ID from the source

            order.'
          readOnly: true
        return_discounts:
          type: array
          items:
            $ref: '#/components/schemas/OrderReturnDiscount'
          description: 'A collection of references to discounts being returned for an order, including the total

            applied discount amount to be returned. The discounts must reference a top-level discount ID

            from the source order.'
          readOnly: true
        return_tips:
          type: array
          items:
            $ref: '#/components/schemas/OrderReturnTip'
          description: A collection of references to tips being returned for an order.
          nullable: true
        rounding_adjustment:
          $ref: '#/components/schemas/OrderRoundingAdjustment'
          description: 'A positive or negative rounding adjustment to the total value being returned. Adjustments are commonly

            used to apply cash rounding when the minimum unit of the account is smaller than the lowest

            physical denomination of the currency.'
          nullable: true
        return_amounts:
          $ref: '#/components/schemas/OrderMoneyAmounts'
          description: An aggregate monetary value being returned by this return entry.
          nullable: true
    ItemVariationLocationOverrides:
      type: object
      description: Price and inventory alerting overrides for a `CatalogItemVariation` at a specific `Location`.
      x-release-status: PUBLIC
      properties:
        location_id:
          type: string
          description: The ID of the `Location`. This can include locations that are deactivated.
          nullable: true
        price_money:
          $ref: '#/components/schemas/Money'
          description: The price of the `CatalogItemVariation` at the given `Location`, or blank for variable pricing.
          nullable: true
        pricing_type:
          $ref: '#/components/schemas/CatalogPricingType'
          description: 'The pricing type (fixed or variable) for the `CatalogItemVariation` at the given `Location`.

            See [CatalogPricingType](#type-catalogpricingtype) for possible values'
          nullable: true
        track_inventory:
          type: boolean
          description: If `true`, inventory tracking is active for the `CatalogItemVariation` at this `Location`.
          nullable: true
        inventory_alert_type:
          $ref: '#/components/schemas/InventoryAlertType'
          description: 'Indicates whether the `CatalogItemVariation` displays an alert when its inventory

            quantity is less than or equal to its `inventory_alert_threshold`.

            See [InventoryAlertType](#type-inventoryalerttype) for possible values'
          nullable: true
        inventory_alert_threshold:
          type: integer
          description: 'If the inventory quantity for the variation is less than or equal to this value and `inventory_alert_type`

            is `LOW_QUANTITY`, the variation displays an alert in the merchant dashboard.


            This value is always an integer.'
          format: int64
          nullable: true
        sold_out:
          type: boolean
          description: 'Indicates whether the overridden item variation is sold out at the specified location.


            When inventory tracking is enabled on the item variation either globally or at the specified location,

            the item variation is automatically marked as sold out when its inventory count reaches zero. The seller

            can manually set the item variation as sold out even when the inventory count is greater than zero.

            Attempts by an application to set this attribute are ignored. Regardless how the sold-out status is set,

            applications should treat its inventory count as zero when this attribute value is `true`.'
          readOnly: true
        sold_out_valid_until:
          type: string
          description: 'The seller-assigned timestamp, of the RFC 3339 format, to indicate when this sold-out variation

            becomes available again at the specified location. Attempts by an application to set this attribute are ignored.

            When the current time is later than this attribute value, the affected item variation is no longer sold out.'
          readOnly: true
    ModifierLocationOverrides:
      type: object
      description: Location-specific overrides for specified properties of a `CatalogModifier` object.
      x-release-status: PUBLIC
      properties:
        location_id:
          type: string
          description: The ID of the `Location` object representing the location. This can include a deactivated location.
          nullable: true
        price_money:
          $ref: '#/components/schemas/Money'
          description: 'The overridden price at the specified location. If this is unspecified, the modifier price is not overridden.

            The modifier becomes free of charge at the specified location, when this `price_money` field is set to 0.'
          nullable: true
        sold_out:
          type: boolean
          description: 'Indicates whether the modifier is sold out at the specified location or not. As an example, for cheese (modifier) burger (item), when the modifier is sold out, it is the cheese, but not the burger, that is sold out.

            The seller can manually set this sold out status. Attempts by an application to set this attribute are ignored.'
          readOnly: true
    TenderType:
      type: string
