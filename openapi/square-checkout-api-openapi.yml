    CatalogObjectType:
      type: string
      enum:
      - ITEM
      - IMAGE
      - CATEGORY
      - ITEM_VARIATION
      - TAX
      - DISCOUNT
      - MODIFIER_LIST
      - MODIFIER
      - PRICING_RULE
      - PRODUCT_SET
      - TIME_PERIOD
      - MEASUREMENT_UNIT
      - SUBSCRIPTION_PLAN_VARIATION
      - ITEM_OPTION
      - ITEM_OPTION_VAL
      - CUSTOM_ATTRIBUTE_DEFINITION
      - QUICK_AMOUNTS_SETTINGS
      - SUBSCRIPTION_PLAN
      - AVAILABILITY_PERIOD
      x-enum-elements:
      - name: ITEM
        description: 'The `CatalogObject` instance is of the [CatalogItem](entity:CatalogItem) type and represents an item. The item-specific data

          must be set on the `item_data` field.'
      - name: IMAGE
        description: 'The `CatalogObject` instance is of the [CatalogImage](entity:CatalogImage) type and represents an image. The image-specific data

          must be set on the `image_data` field.'
      - name: CATEGORY
        description: 'The `CatalogObject` instance is of the [CatalogCategory](entity:CatalogCategory) type and represents a category. The category-specific data

          must be set on the `category_data` field.'
      - name: ITEM_VARIATION
        description: 'The `CatalogObject` instance is of the  [CatalogItemVariation](entity:CatalogItemVariation) type and represents an item variation, also referred to as variation.

          The item variation-specific data must be set on the `item_variation_data` field.'
      - name: TAX
        description: 'The `CatalogObject` instance is of the [CatalogTax](entity:CatalogTax) type and represents a tax. The tax-specific data

          must be set on the `tax_data` field.'
      - name: DISCOUNT
        description: 'The `CatalogObject` instance is of the [CatalogDiscount](entity:CatalogDiscount) type and represents a discount. The discount-specific data

          must be set on the `discount_data` field.'
      - name: MODIFIER_LIST
        description: 'The `CatalogObject` instance is of the [CatalogModifierList](entity:CatalogModifierList) type and represents a modifier list.

          The modifier-list-specific data must be set on the `modifier_list_data` field.'
      - name: MODIFIER
        description: 'The `CatalogObject` instance is of the [CatalogModifier](entity:CatalogModifier) type and represents a modifier. The modifier-specific data

          must be set on the `modifier_data` field.'
      - name: PRICING_RULE
        description: 'The `CatalogObject` instance is of the [CatalogPricingRule](entity:CatalogPricingRule) type and represents a pricing rule. The pricing-rule-specific data

          must be set on the `pricing_rule_data` field.'
      - name: PRODUCT_SET
        description: 'The `CatalogObject` instance is of the [CatalogProductSet](entity:CatalogProductSet) type and represents a product set.

          The product-set-specific data will be stored in the `product_set_data` field.'
      - name: TIME_PERIOD
        description: 'The `CatalogObject` instance is of the [CatalogTimePeriod](entity:CatalogTimePeriod) type and represents a time period.

          The time-period-specific data must be set on the `time_period_data` field.'
      - name: MEASUREMENT_UNIT
        description: 'The `CatalogObject` instance is of the [CatalogMeasurementUnit](entity:CatalogMeasurementUnit) type and represents a measurement unit specifying the unit of

          measure and precision in which an item variation is sold. The measurement-unit-specific data must set on the `measurement_unit_data` field.'
      - name: SUBSCRIPTION_PLAN_VARIATION
        description: 'The `CatalogObject` instance is of the [CatalogSubscriptionPlan](entity:CatalogSubscriptionPlan) type and represents a subscription plan.

          The subscription-plan-specific data must be stored on the `subscription_plan_data` field.'
      - name: ITEM_OPTION
        description: 'The `CatalogObject` instance is of the [CatalogItemOption](entity:CatalogItemOption) type and represents a list of options (such as a color or size of a T-shirt)

          that can be assigned to item variations. The item-option-specific data must be on the `item_option_data` field.'
      - name: ITEM_OPTION_VAL
        description: 'The `CatalogObject` instance is of the [CatalogItemOptionValue](entity:CatalogItemOptionValue) type and represents a value associated with one or more item options.

          For example, an item option of "Size" may have item option values such as "Small" or "Medium".

          The item-option-value-specific data must be on the `item_option_value_data` field.'
      - name: CUSTOM_ATTRIBUTE_DEFINITION
        description: 'The `CatalogObject` instance is of the [CatalogCustomAttributeDefinition](entity:CatalogCustomAttributeDefinition) type and represents the definition of a custom attribute.

          The custom-attribute-definition-specific data must be set on the `custom_attribute_definition_data` field.'
      - name: QUICK_AMOUNTS_SETTINGS
        description: 'The `CatalogObject` instance is of the [CatalogQuickAmountsSettings](entity:CatalogQuickAmountsSettings) type and represents settings to configure preset charges for quick payments at each location.

          For example, a location may have a list of both AUTO and MANUAL quick amounts that are set to DISABLED.

          The quick-amounts-settings-specific data must be set on the `quick_amounts_settings_data` field.'
      - name: SUBSCRIPTION_PLAN
        description: 'The `CatalogObject` instance is of the [CatalogSubscriptionPlan](entity:CatalogSubscriptionPlan) type and represents a subscription plan.

          The subscription plan specific data must be stored on the `subscription_plan_data` field.'
      - name: AVAILABILITY_PERIOD
        description: 'The `CatalogObject` instance is of the [CatalogAvailabilityPeriod](entity:CatalogAvailabilityPeriod) type and represents an availability period.

          The availability period specific data must be stored on the `availability_period_data` field.'
      description: 'Possible types of CatalogObjects returned from the catalog, each

        containing type-specific properties in the `*_data` field corresponding to the specified object type.'
      x-release-status: PUBLIC
