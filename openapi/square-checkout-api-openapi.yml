    CreateCheckoutRequest:
      type: object
      description: 'Defines the parameters that can be included in the body of

        a request to the `CreateCheckout` endpoint.'
      x-release-status: PUBLIC
      required:
      - idempotency_key
      - order
      properties:
        idempotency_key:
          type: string
          description: "A unique string that identifies this checkout among others you have created. It can be\nany valid string but must be unique for every order sent to Square Checkout for a given location ID.\n\nThe idempotency key is used to avoid processing the same order more than once. If you are \nunsure whether a particular checkout was created successfully, you can attempt it again with\nthe same idempotency key and all the same other parameters without worrying about creating duplicates.\n\nYou should use a random number/string generator native to the language\nyou are working in to generate strings for your idempotency keys.\n\nFor more information, see [Idempotency](https://developer.squareup.com/docs/working-with-apis/idempotency)."
          minLength: 1
          maxLength: 192
        order:
          $ref: '#/components/schemas/CreateOrderRequest'
          description: The order including line items to be checked out.
        ask_for_shipping_address:
          type: boolean
          description: "If `true`, Square Checkout collects shipping information on your behalf and stores \nthat information with the transaction information in the Square Seller Dashboard.\n\nDefault: `false`."
        merchant_support_email:
          type: string
          description: 'The email address to display on the Square Checkout confirmation page

            and confirmation email that the buyer can use to contact the seller.


            If this value is not set, the confirmation page and email display the

            primary email address associated with the seller''s Square account.


            Default: none; only exists if explicitly set.'
          maxLength: 254
        pre_populate_buyer_email:
          type: string
          description: 'If provided, the buyer''s email is prepopulated on the checkout page

            as an editable text field.


            Default: none; only exists if explicitly set.'
          maxLength: 254
        pre_populate_shipping_address:
          $ref: '#/components/schemas/Address'
          description: 'If provided, the buyer''s shipping information is prepopulated on the

            checkout page as editable text fields.


            Default: none; only exists if explicitly set.'
        redirect_url:
          type: string
          description: 'The URL to redirect to after the checkout is completed with `checkoutId`,

            `transactionId`, and `referenceId` appended as URL parameters. For example,

            if the provided redirect URL is `http://www.example.com/order-complete`, a

            successful transaction redirects the customer to:


            `http://www.example.com/order-complete?checkoutId=xxxxxx&amp;referenceId=xxxxxx&amp;transactionId=xxxxxx`


            If you do not provide a redirect URL, Square Checkout displays an order

            confirmation page on your behalf; however, it is strongly recommended that

            you provide a redirect URL so you can verify the transaction results and

            finalize the order through your existing/normal confirmation workflow.


            Default: none; only exists if explicitly set.'
          maxLength: 800
        additional_recipients:
          type: array
          items:
            $ref: '#/components/schemas/ChargeRequestAdditionalRecipient'
          description: 'The basic primitive of a multi-party transaction. The value is optional.

            The transaction facilitated by you can be split from here.


            If you provide this value, the `amount_money` value in your `additional_recipients` field

            cannot be more than 90% of the `total_money` calculated by Square for your order.

            The `location_id` must be a valid seller location where the checkout is occurring.


            This field requires `PAYMENTS_WRITE_ADDITIONAL_RECIPIENTS` OAuth permission.


            This field is currently not supported in the Square Sandbox.'
        note:
          type: string
          description: 'An optional note to associate with the `checkout` object.


            This value cannot exceed 60 characters.'
          maxLength: 60
