- url: https://connect.squareup.com
  variables: {}
tags:
- name: GiftCardActivities
paths:
  /v2/gift-cards/activities:
    get:
      tags:
      - GiftCardActivities
      summary: Square List Gift Card Activities
      operationId: ListGiftCardActivities
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Lists gift card activities. By default, you get gift card activities for all

        gift cards in the seller''s account. You can optionally specify query parameters to

        filter the list. For example, you can get a list of gift card activities for a gift card,

        for all gift cards in a specific region, or for activities within a time window.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - GIFTCARDS_READ
      parameters:
      - name: gift_card_id
        description: "If a gift card ID is provided, the endpoint returns activities related \nto the specified gift card. Otherwise, the endpoint returns all gift card activities for \nthe seller."
        schema:
          type: string
        in: query
        required: false
      - name: type
        description: "If a [type](entity:GiftCardActivityType) is provided, the endpoint returns gift card activities of the specified type. \nOtherwise, the endpoint returns all types of gift card activities."
        schema:
          type: string
        in: query
        required: false
      - name: location_id
        description: "If a location ID is provided, the endpoint returns gift card activities for the specified location. \nOtherwise, the endpoint returns gift card activities for all locations."
        schema:
          type: string
        in: query
        required: false
      - name: begin_time
        description: 'The timestamp for the beginning of the reporting period, in RFC 3339 format.

          This start time is inclusive. The default value is the current time minus one year.'
        schema:
          type: string
        in: query
        required: false
      - name: end_time
        description: 'The timestamp for the end of the reporting period, in RFC 3339 format.

          This end time is inclusive. The default value is the current time.'
        schema:
          type: string
        in: query
        required: false
      - name: limit
        description: "If a limit is provided, the endpoint returns the specified number \nof results (or fewer) per page. The maximum value is 100. The default value is 50.\nFor more information, see [Pagination](https://developer.squareup.com/docs/working-with-apis/pagination)."
        schema:
          type: integer
        in: query
        required: false
      - name: cursor
        description: 'A pagination cursor returned by a previous call to this endpoint.

          Provide this cursor to retrieve the next set of results for the original query.

          If a cursor is not provided, the endpoint returns the first page of the results.

          For more information, see [Pagination](https://developer.squareup.com/docs/working-with-apis/pagination).'
        schema:
          type: string
        in: query
        required: false
      - name: sort_order
        description: 'The order in which the endpoint returns the activities, based on `created_at`.

          - `ASC` - Oldest to newest.

          - `DESC` - Newest to oldest (default).'
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGiftCardActivitiesResponse'
    post:
      tags:
      - GiftCardActivities
      summary: Square Create Gift Card Activity
      operationId: CreateGiftCardActivity
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Creates a gift card activity to manage the balance or state of a [gift card](entity:GiftCard).

        For example, create an `ACTIVATE` activity to activate a gift card with an initial balance before first use.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - GIFTCARDS_WRITE
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGiftCardActivityRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGiftCardActivityResponse'
      x-endpoint-errors:
      - error-code: INSUFFICIENT_FUNDS
      - error-code: PAYMENT_LIMIT_EXCEEDED
      - error-code: REFUND_AMOUNT_INVALID
      - error-code: TEMPORARY_ERROR
components:
  schemas:
    GiftCardActivityAdjustDecrementReason:
      type: string
      enum:
      - SUSPICIOUS_ACTIVITY
      - BALANCE_ACCIDENTALLY_INCREASED
      - SUPPORT_ISSUE
      - PURCHASE_WAS_REFUNDED
      x-enum-elements:
      - name: SUSPICIOUS_ACTIVITY
        description: 'The balance was decreased because the seller detected suspicious or fraudulent activity

          on the gift card.'
      - name: BALANCE_ACCIDENTALLY_INCREASED
        description: The balance was decreased to reverse an unintentional balance increase.
      - name: SUPPORT_ISSUE
        description: The balance was decreased to accommodate support issues.
      - name: PURCHASE_WAS_REFUNDED
        description: 'The balance was decreased because the order used to purchase or reload the

          gift card was refunded.'
      description: Indicates the reason for deducting money from a [gift card](entity:GiftCard).
      x-release-status: PUBLIC
    GiftCardActivityAdjustDecrement:
      type: object
      description: Represents details about an `ADJUST_DECREMENT` [gift card activity type](entity:GiftCardActivityType).
      x-release-status: PUBLIC
      required:
      - amount_money
      - reason
      properties:
        amount_money:
          $ref: '#/components/schemas/Money'
          description: The amount deducted from the gift card balance. This value is a positive integer.
        reason:
          $ref: '#/components/schemas/GiftCardActivityAdjustDecrementReason'
          description: 'The reason the gift card balance was adjusted.

            See [Reason](#type-reason) for possible values'
    ErrorCategory:
      type: string
      enum:
      - API_ERROR
      - AUTHENTICATION_ERROR
      - INVALID_REQUEST_ERROR
      - RATE_LIMIT_ERROR
      - PAYMENT_METHOD_ERROR
      - REFUND_ERROR
      - MERCHANT_SUBSCRIPTION_ERROR
      - EXTERNAL_VENDOR_ERROR
      x-enum-elements:
      - name: API_ERROR
        description: An error occurred with the Connect API itself.
      - name: AUTHENTICATION_ERROR
        description: 'An authentication error occurred. Most commonly, the request had

          a missing, malformed, or otherwise invalid `Authorization` header.'
      - name: INVALID_REQUEST_ERROR
        description: 'The request was invalid. Most commonly, a required parameter was

          missing, or a provided parameter had an invalid value.'
      - name: RATE_LIMIT_ERROR
        description: 'Your application reached the Square API rate limit. You might receive this error if your application sends a high number of requests

          to Square APIs in a short period of time.


          Your application should monitor responses for `429 RATE_LIMITED` errors and use a retry mechanism with an [exponential backoff](https://en.wikipedia.org/wiki/Exponential_backoff)

          schedule to resend the requests at an increasingly slower rate. It is also a good practice to use a randomized delay (jitter) in your retry schedule.'
      - name: PAYMENT_METHOD_ERROR
        description: 'An error occurred while processing a payment method. Most commonly,

          the details of the payment method were invalid (such as a card''s CVV

          or expiration date).'
      - name: REFUND_ERROR
        description: An error occurred while attempting to process a refund.
      - name: MERCHANT_SUBSCRIPTION_ERROR
        description: An error occurred when checking a merchant subscription status
      - name: EXTERNAL_VENDOR_ERROR
        description: An error that is returned from an external vendor's API
      description: 'Indicates which high-level category of error has occurred during a

        request to the Connect API.'
