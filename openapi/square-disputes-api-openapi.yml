servers:
- url: https://connect.squareup.com
  variables: {}
tags:
- name: Disputes
paths:
  /v2/disputes:
    get:
      tags:
      - Disputes
      summary: Square List Disputes
      operationId: ListDisputes
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Returns a list of disputes associated with a particular account.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - DISPUTES_READ
      parameters:
      - name: cursor
        description: 'A pagination cursor returned by a previous call to this endpoint.

          Provide this cursor to retrieve the next set of results for the original query.

          For more information, see [Pagination](https://developer.squareup.com/docs/build-basics/common-api-patterns/pagination).'
        schema:
          type: string
        in: query
        required: false
      - name: states
        description: The dispute states used to filter the result. If not specified, the endpoint returns all disputes.
        schema:
          $ref: '#/components/schemas/DisputeState'
        in: query
        required: false
      - name: location_id
        description: 'The ID of the location for which to return a list of disputes.

          If not specified, the endpoint returns disputes associated with all locations.'
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDisputesResponse'
  /v2/disputes/{dispute_id}:
    get:
      tags:
      - Disputes
      summary: Square Retrieve Dispute
      operationId: RetrieveDispute
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Returns details about a specific dispute.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - DISPUTES_READ
      parameters:
      - name: dispute_id
        description: The ID of the dispute you want more details about.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveDisputeResponse'
  /v2/disputes/{dispute_id}/accept:
    post:
      tags:
      - Disputes
      summary: Square Accept Dispute
      operationId: AcceptDispute
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Accepts the loss on a dispute. Square returns the disputed amount to the cardholder and

        updates the dispute state to ACCEPTED.


        Square debits the disputed amount from the seller’s Square account. If the Square account

        does not have sufficient funds, Square debits the associated bank account.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - DISPUTES_WRITE
      parameters:
      - name: dispute_id
        description: The ID of the dispute you want to accept.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptDisputeResponse'
  /v2/disputes/{dispute_id}/evidence:
    get:
      tags:
      - Disputes
      summary: Square List Dispute Evidence
      operationId: ListDisputeEvidence
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Returns a list of evidence associated with a dispute.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - DISPUTES_READ
      parameters:
      - name: dispute_id
        description: The ID of the dispute.
        schema:
          type: string
        in: path
        required: true
      - name: cursor
        description: 'A pagination cursor returned by a previous call to this endpoint.

          Provide this cursor to retrieve the next set of results for the original query.

          For more information, see [Pagination](https://developer.squareup.com/docs/build-basics/common-api-patterns/pagination).'
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDisputeEvidenceResponse'
  /v2/disputes/{dispute_id}/evidence-files:
    post:
      tags:
      - Disputes
      summary: Square Create Dispute Evidence File
      operationId: CreateDisputeEvidenceFile
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Uploads a file to use as evidence in a dispute challenge. The endpoint accepts HTTP

        multipart/form-data file uploads in HEIC, HEIF, JPEG, PDF, PNG, and TIFF formats.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - DISPUTES_WRITE
      parameters:
      - name: dispute_id
        description: The ID of the dispute for which you want to upload evidence.
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: '#/components/schemas/CreateDisputeEvidenceFileRequest'
                image_file:
                  type: string
                  format: binary
            encoding:
              image_file:
                contentType: image/jpeg
              request:
                contentType: application/json; charset=utf-8
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDisputeEvidenceFileResponse'
  /v2/disputes/{dispute_id}/evidence-text:
    post:
      tags:
      - Disputes
      summary: Square Create Dispute Evidence Text
      operationId: CreateDisputeEvidenceText
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: Uploads text to use as evidence for a dispute challenge.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - DISPUTES_WRITE
      parameters:
      - name: dispute_id
        description: The ID of the dispute for which you want to upload evidence.
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisputeEvidenceTextRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDisputeEvidenceTextResponse'
  /v2/disputes/{dispute_id}/evidence/{evidence_id}:
    delete:
      tags:
      - Disputes
      summary: Square Delete Dispute Evidence
      operationId: DeleteDisputeEvidence
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Removes specified evidence from a dispute.

        Square does not send the bank any evidence that is removed.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - DISPUTES_WRITE
      parameters:
      - name: dispute_id
        description: The ID of the dispute from which you want to remove evidence.
        schema:
          type: string
        in: path
        required: true
      - name: evidence_id
        description: The ID of the evidence you want to remove.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDisputeEvidenceResponse'
    get:
      tags:
      - Disputes
      summary: Square Retrieve Dispute Evidence
      operationId: RetrieveDisputeEvidence
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Returns the metadata for the evidence specified in the request URL path.


        You must maintain a copy of any evidence uploaded if you want to reference it later. Evidence cannot be downloaded after you upload it.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - DISPUTES_READ
      parameters:
      - name: dispute_id
        description: The ID of the dispute from which you want to retrieve evidence metadata.
        schema:
          type: string
        in: path
        required: true
      - name: evidence_id
        description: The ID of the evidence to retrieve.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveDisputeEvidenceResponse'
  /v2/disputes/{dispute_id}/submit-evidence:
    post:
      tags:
      - Disputes
      summary: Square Submit Evidence
      operationId: SubmitEvidence
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      description: 'Submits evidence to the cardholder''s bank.


        The evidence submitted by this endpoint includes evidence uploaded

        using the [CreateDisputeEvidenceFile](api-endpoint:Disputes-CreateDisputeEvidenceFile) and

        [CreateDisputeEvidenceText](api-endpoint:Disputes-CreateDisputeEvidenceText) endpoints and

        evidence automatically provided by Square, when available. Evidence cannot be removed from

        a dispute after submission.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - DISPUTES_WRITE
      parameters:
      - name: dispute_id
        description: The ID of the dispute for which you want to submit evidence.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitEvidenceResponse'
components:
  schemas:
    DisputedPayment:
      type: object
      description: The payment the cardholder disputed.
      x-release-status: PUBLIC
      properties:
        payment_id:
          type: string
          description: Square-generated unique ID of the payment being disputed.
          minLength: 1
          maxLength: 192
          nullable: true
    ErrorCategory:
      type: string
      enum:
      - API_ERROR
      - AUTHENTICATION_ERROR
      - INVALID_REQUEST_ERROR
      - RATE_LIMIT_ERROR
      - PAYMENT_METHOD_ERROR
      - REFUND_ERROR
      - MERCHANT_SUBSCRIPTION_ERROR
      - EXTERNAL_VENDOR_ERROR
      x-enum-elements:
      - name: API_ERROR
        description: An error occurred with the Connect API itself.
      - name: AUTHENTICATION_ERROR
        description: 'An authentication error occurred. Most commonly, the request had

          a missing, malformed, or otherwise invalid `Authorization` header.'
      - name: INVALID_REQUEST_ERROR
        description: 'The request was invalid. Most commonly, a required parameter was

          missing, or a provided parameter had an invalid value.'
      - name: RATE_LIMIT_ERROR
        description: 'Your application reached the Square API rate limit. You might receive this error if your application sends a high number of requests

          to Square APIs in a short period of time.


          Your application should monitor responses for `429 RATE_LIMITED` errors and use a retry mechanism with an [exponential backoff](https://en.wikipedia.org/wiki/Exponential_backoff)

          schedule to resend the requests at an increasingly slower rate. It is also a good practice to use a randomized delay (jitter) in your retry schedule.'
      - name: PAYMENT_METHOD_ERROR
        description: 'An error occurred while processing a payment method. Most commonly,

          the details of the payment method were invalid (such as a card''s CVV

          or expiration date).'
      - name: REFUND_ERROR
        description: An error occurred while attempting to process a refund.
      - name: MERCHANT_SUBSCRIPTION_ERROR
        description: An error occurred when checking a merchant subscription status
      - name: EXTERNAL_VENDOR_ERROR
        description: An error that is returned from an external vendor's API
      description: 'Indicates which high-level category of error has occurred during a

        request to the Connect API.'
      x-release-status: PUBLIC
