    type: Documentation
  - url: https://developer.squareup.com/reference/square/transfer-orders-api
    type: APIReference
  description: >-
    The Transfer Orders API lets applications create and manage transfers of inventory stock between a
    seller's locations, supporting multi-location retail and restaurant operations.
