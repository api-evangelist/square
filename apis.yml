apis:
- aid: square:reporting-api
  name: Square Reporting API
  tags:
  - Analytics
  - Business Intelligence
  - Reporting
  humanURL: https://developer.squareup.com/docs/reporting-api
  properties:
  - url: https://developer.squareup.com/docs/reporting-api
    type: Documentation
  - url: https://developer.squareup.com/reference/square/reporting-api
    type: APIReference
  description: >-
    The Reporting API (Beta) provides a new way to access all of a business's data to build custom reports
    and integrations, surfacing sales, payments, and operational metrics across a seller's Square account.
- aid: square:channels-api
  name: Square Channels API
  tags:
  - Commerce
  - Omnichannel
  - Sales Channels
  humanURL: https://developer.squareup.com/docs/channels-api/overview
  properties:
  - url: https://developer.squareup.com/docs/channels-api/overview
    type: Documentation
  - url: https://developer.squareup.com/reference/square/channels-api
    type: APIReference
  description: >-
    The Channels API lets applications represent and manage the sales channels through which a seller
    transacts, enabling attribution of orders and payments to specific online or in-person channels.
- aid: square:transfer-orders-api
  name: Square Transfer Orders API
  tags:
  - Commerce
  - Inventory
  - Transfer Orders
  humanURL: https://developer.squareup.com/docs/transfer-orders-api/overview
