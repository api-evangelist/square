arazzo: 1.0.1
info:
  title: Square Payments to Google Sheets Rows
  summary: List recent Square payments and append the newest one as a row in a Google
    Sheet.
  description: List recent Square payments and append the newest one as a row in a
    Google Sheet. Recreated from the named Zapier template as forkable Arazzo; polling/trigger
    semantics are left to the runner.
  version: 1.0.0
x-integration:
  partner: google-sheets
  template: https://zapier.com/apps/google-sheets/integrations/square/24510/save-new-square-transactions-to-google-sheets-rows
  edge_evidence: https://zapier.com/apps/google-sheets/integrations/square/24510/save-new-square-transactions-to-google-sheets-rows
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: claude-opus enrichment pass local-v5
sourceDescriptions:
- name: squarePaymentsApi
  url: https://raw.githubusercontent.com/api-evangelist/square/refs/heads/main/openapi/square-payments-api-openapi.yml
  type: openapi
- name: googleSheetsValuesApi
  url: https://raw.githubusercontent.com/api-evangelist/google-sheets/refs/heads/main/openapi/google-sheets-values-api-openapi.yml
  type: openapi
workflows:
- workflowId: square-payments-to-google-sheets
  summary: List recent Square payments and append the newest one as a row in a Google
    Sheet.
  inputs:
    type: object
    properties:
      locationId:
        type: string
      beginTime:
        type: string
      spreadsheetId:
        type: string
      range:
        type: string
  steps:
  - stepId: list-payments
    description: List payments taken since beginTime, newest first.
    operationId: $sourceDescriptions.squarePaymentsApi.ListPayments
    parameters:
    - name: location_id
      in: query
      value: $inputs.locationId
    - name: begin_time
      in: query
      value: $inputs.beginTime
    - name: sort_order
      in: query
      value: DESC
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      paymentId: $response.body#/payments/0/id
      amount: $response.body#/payments/0/amount_money/amount
      currency: $response.body#/payments/0/amount_money/currency
      createdAt: $response.body#/payments/0/created_at
  - stepId: append-row
    description: Append the payment as a sheet row.
    operationId: $sourceDescriptions.googleSheetsValuesApi.appendValues
    parameters:
    - name: spreadsheetId
      in: path
      value: $inputs.spreadsheetId
    - name: range
      in: path
      value: $inputs.range
    - name: valueInputOption
      in: query
      value: USER_ENTERED
    requestBody:
      contentType: application/json
      payload:
        values:
        - - $steps.list-payments.outputs.paymentId
          - $steps.list-payments.outputs.createdAt
          - $steps.list-payments.outputs.amount
          - $steps.list-payments.outputs.currency
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      updatedRange: $response.body#/updates/updatedRange
  outputs:
    paymentId: $steps.list-payments.outputs.paymentId
    updatedRange: $steps.append-row.outputs.updatedRange
