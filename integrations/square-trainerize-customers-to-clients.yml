arazzo: 1.0.1
info:
  title: Square Customers to Trainerize Clients
  summary: Create a Trainerize client from the newest Square customer.
  description: Create a Trainerize client from the newest Square customer. Recreated
    as forkable Arazzo from the integration evidence; polling/trigger semantics are
    left to the runner.
  version: 1.0.0
x-integration:
  partner: trainerize
  template: https://zapier.com/apps/abc-trainerize/integrations/square/75664/create-clients-in-trainerize-when-new-customers-are-added-in-square
  edge_evidence: https://zapier.com/apps/abc-trainerize/integrations/square/75664/create-clients-in-trainerize-when-new-customers-are-added-in-square
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: pipeline step 25b (payments-integration-arazzo)
sourceDescriptions:
- name: squareCustomersApi
  url: https://raw.githubusercontent.com/api-evangelist/square/refs/heads/main/openapi/square-customers-api-openapi.yml
  type: openapi
- name: trainerizeClientsApi
  url: https://raw.githubusercontent.com/api-evangelist/trainerize/refs/heads/main/openapi/trainerize-clients-api-openapi.yml
  type: openapi
workflows:
- workflowId: square-trainerize-customers-to-clients
  summary: Create a Trainerize client from the newest Square customer.
  inputs:
    type: object
    properties: {}
  steps:
  - stepId: list-customers
    description: List Square customers, most recently created first.
    operationId: $sourceDescriptions.squareCustomersApi.ListCustomers
    parameters:
    - name: sort_field
      in: query
      value: CREATED_AT
    - name: sort_order
      in: query
      value: DESC
    - name: limit
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      customerId: $response.body#/customers/0/id
      email: $response.body#/customers/0/email_address
      givenName: $response.body#/customers/0/given_name
      familyName: $response.body#/customers/0/family_name
      phone: $response.body#/customers/0/phone_number
  - stepId: add-client
    description: Create or update the client in Trainerize.
    operationId: $sourceDescriptions.trainerizeClientsApi.addOrUpdateClient
    requestBody:
      contentType: application/json
      payload:
        email: $steps.list-customers.outputs.email
        firstName: $steps.list-customers.outputs.givenName
        lastName: $steps.list-customers.outputs.familyName
        phone: $steps.list-customers.outputs.phone
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      userId: $response.body#/userID
  outputs:
    squareCustomerId: $steps.list-customers.outputs.customerId
    trainerizeUserId: $steps.add-client.outputs.userId
