arazzo: 1.0.1
info:
  title: Square Payments to Airtable Records
  summary: Save the newest Square payment as an Airtable record.
  description: Save the newest Square payment as an Airtable record. Recreated as
    forkable Arazzo from the integration evidence; polling/trigger semantics are left
    to the runner.
  version: 1.0.0
x-integration:
  partner: airtable
  edge_evidence: https://zapier.com/apps/square/integrations/airtable
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: pipeline step 25b (payments-integration-arazzo)
sourceDescriptions:
- name: squarePaymentsApi
  url: https://raw.githubusercontent.com/api-evangelist/square/refs/heads/main/openapi/square-payments-api-openapi.yml
  type: openapi
- name: airtableRecordsApi
  url: https://raw.githubusercontent.com/api-evangelist/airtable/refs/heads/main/openapi/airtable-records-api-openapi.yml
  type: openapi
workflows:
- workflowId: square-airtable-payments-to-records
  summary: Save the newest Square payment as an Airtable record.
  inputs:
    type: object
    properties:
      baseId:
        type: string
      tableIdOrName:
        type: string
  steps:
  - stepId: list-payments
    description: List the most recent Square payment.
    operationId: $sourceDescriptions.squarePaymentsApi.ListPayments
    parameters:
    - name: sort_order
      in: query
      value: DESC
    - name: limit
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      paymentId: $response.body#/payments/0/id
      amount: $response.body#/payments/0/amount_money/amount
      currency: $response.body#/payments/0/amount_money/currency
      status: $response.body#/payments/0/status
      createdAt: $response.body#/payments/0/created_at
  - stepId: create-record
    description: Create a record for the payment.
    operationId: $sourceDescriptions.airtableRecordsApi.createRecords
    parameters:
    - name: baseId
      in: path
      value: $inputs.baseId
    - name: tableIdOrName
      in: path
      value: $inputs.tableIdOrName
    requestBody:
      contentType: application/json
      payload:
        typecast: true
        records:
        - fields:
            Payment ID: $steps.list-payments.outputs.paymentId
            Amount: $steps.list-payments.outputs.amount
            Currency: $steps.list-payments.outputs.currency
            Status: $steps.list-payments.outputs.status
            Created At: $steps.list-payments.outputs.createdAt
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      recordId: $response.body#/records/0/id
  outputs:
    squarePaymentId: $steps.list-payments.outputs.paymentId
    airtableRecordId: $steps.create-record.outputs.recordId
