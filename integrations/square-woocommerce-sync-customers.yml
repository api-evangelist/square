arazzo: 1.0.1
info:
  title: Square Customers to WooCommerce
  summary: Create a WooCommerce customer from the newest Square customer.
  description: Create a WooCommerce customer from the newest Square customer. Recreated
    as forkable Arazzo from the integration evidence; polling/trigger semantics are
    left to the runner.
  version: 1.0.0
x-integration:
  partner: woocommerce
  edge_evidence: https://squareup.com/us/en/app-marketplace/app/woocommerce
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: pipeline step 25b (payments-integration-arazzo)
sourceDescriptions:
- name: squareCustomersApi
  url: https://raw.githubusercontent.com/api-evangelist/square/refs/heads/main/openapi/square-customers-api-openapi.yml
  type: openapi
- name: woocommerceCustomersApi
  url: https://raw.githubusercontent.com/api-evangelist/woocommerce/refs/heads/main/openapi/woocommerce-customers-api-openapi.yml
  type: openapi
workflows:
- workflowId: square-woocommerce-sync-customers
  summary: Create a WooCommerce customer from the newest Square customer.
  inputs:
    type: object
    properties: {}
  steps:
  - stepId: list-customers
    description: List Square customers, most recently created first.
    operationId: $sourceDescriptions.squareCustomersApi.ListCustomers
    parameters:
    - name: sort_field
      in: query
      value: CREATED_AT
    - name: sort_order
      in: query
      value: DESC
    - name: limit
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      customerId: $response.body#/customers/0/id
      email: $response.body#/customers/0/email_address
      givenName: $response.body#/customers/0/given_name
      familyName: $response.body#/customers/0/family_name
      phone: $response.body#/customers/0/phone_number
  - stepId: create-customer
    description: Create the customer in WooCommerce.
    operationId: $sourceDescriptions.woocommerceCustomersApi.createCustomer
    requestBody:
      contentType: application/json
      payload:
        email: $steps.list-customers.outputs.email
        first_name: $steps.list-customers.outputs.givenName
        last_name: $steps.list-customers.outputs.familyName
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      wooCustomerId: $response.body#/id
  outputs:
    squareCustomerId: $steps.list-customers.outputs.customerId
    wooCustomerId: $steps.create-customer.outputs.wooCustomerId
