arazzo: 1.0.1
info:
  title: Square Customers to Pipedrive Persons
  summary: Create a Pipedrive person from the newest Square customer.
  description: Create a Pipedrive person from the newest Square customer. Recreated
    as forkable Arazzo from the integration evidence; polling/trigger semantics are
    left to the runner.
  version: 1.0.0
x-integration:
  partner: pipedrive
  edge_evidence: https://zapier.com/apps/square/integrations/pipedrive
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: pipeline step 25b (payments-integration-arazzo)
sourceDescriptions:
- name: squareCustomersApi
  url: https://raw.githubusercontent.com/api-evangelist/square/refs/heads/main/openapi/square-customers-api-openapi.yml
  type: openapi
- name: pipedrivePersonsApi
  url: https://raw.githubusercontent.com/api-evangelist/pipedrive/refs/heads/main/openapi/pipedrive-persons-api-openapi.yml
  type: openapi
workflows:
- workflowId: square-pipedrive-customers-to-persons
  summary: Create a Pipedrive person from the newest Square customer.
  inputs:
    type: object
    properties: {}
  steps:
  - stepId: list-customers
    description: List Square customers, most recently created first.
    operationId: $sourceDescriptions.squareCustomersApi.ListCustomers
    parameters:
    - name: sort_field
      in: query
      value: CREATED_AT
    - name: sort_order
      in: query
      value: DESC
    - name: limit
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      customerId: $response.body#/customers/0/id
      email: $response.body#/customers/0/email_address
      givenName: $response.body#/customers/0/given_name
      familyName: $response.body#/customers/0/family_name
      phone: $response.body#/customers/0/phone_number
  - stepId: add-person
    description: Create the person in Pipedrive.
    operationId: $sourceDescriptions.pipedrivePersonsApi.addPerson
    requestBody:
      contentType: application/json
      payload:
        name: $steps.list-customers.outputs.givenName
        emails:
        - value: $steps.list-customers.outputs.email
          primary: true
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      personId: $response.body#/data/id
  outputs:
    squareCustomerId: $steps.list-customers.outputs.customerId
    pipedrivePersonId: $steps.add-person.outputs.personId
