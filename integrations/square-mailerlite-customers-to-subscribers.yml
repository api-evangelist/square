arazzo: 1.0.1
info:
  title: Square Customers to MailerLite Subscribers
  summary: Add the newest Square customer as a MailerLite subscriber.
  description: Add the newest Square customer as a MailerLite subscriber. Recreated
    as forkable Arazzo from the integration evidence; polling/trigger semantics are
    left to the runner.
  version: 1.0.0
x-integration:
  partner: mailerlite
  edge_evidence: https://zapier.com/apps/square/integrations/mailerlite
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: pipeline step 25b (payments-integration-arazzo)
sourceDescriptions:
- name: squareCustomersApi
  url: https://raw.githubusercontent.com/api-evangelist/square/refs/heads/main/openapi/square-customers-api-openapi.yml
  type: openapi
- name: mailerliteSubscribersApi
  url: https://raw.githubusercontent.com/api-evangelist/mailerlite/refs/heads/main/openapi/mailerlite-subscribers-api-openapi.yml
  type: openapi
workflows:
- workflowId: square-mailerlite-customers-to-subscribers
  summary: Add the newest Square customer as a MailerLite subscriber.
  inputs:
    type: object
    properties: {}
  steps:
  - stepId: list-customers
    description: List Square customers, most recently created first.
    operationId: $sourceDescriptions.squareCustomersApi.ListCustomers
    parameters:
    - name: sort_field
      in: query
      value: CREATED_AT
    - name: sort_order
      in: query
      value: DESC
    - name: limit
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      customerId: $response.body#/customers/0/id
      email: $response.body#/customers/0/email_address
      givenName: $response.body#/customers/0/given_name
      familyName: $response.body#/customers/0/family_name
      phone: $response.body#/customers/0/phone_number
  - stepId: upsert-subscriber
    description: Create or update the subscriber in MailerLite.
    operationId: $sourceDescriptions.mailerliteSubscribersApi.upsertSubscriber
    requestBody:
      contentType: application/json
      payload:
        email: $steps.list-customers.outputs.email
        fields:
          name: $steps.list-customers.outputs.givenName
          last_name: $steps.list-customers.outputs.familyName
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      subscriberId: $response.body#/data/id
  outputs:
    squareCustomerId: $steps.list-customers.outputs.customerId
    subscriberId: $steps.upsert-subscriber.outputs.subscriberId
